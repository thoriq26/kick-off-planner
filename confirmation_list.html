<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Confirmation List - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />

        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                min-height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                min-height: 100vh;
                min-height: 100svh;
                width: 100%;
                box-sizing: border-box;
                padding: clamp(12px, 3vw, 20px);
                overflow-x: hidden;
                /* Mempertahankan Background Image */
                background:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("geminix.jpg");
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: scroll;
                background-size: cover;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                box-sizing: border-box;
                width: calc(100% - 24px);
                max-width: 1000px;
                border-radius: 12px;
                margin-bottom: 20px;
                min-height: 64px;
                height: auto;
                padding: 12px clamp(40px, 11vw, 64px);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 4px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                position: relative;
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 26px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: #e74c3c;
            }

            .nav-title {
                color: white;
                font-weight: 900;
                letter-spacing: clamp(0.5px, 0.6vw, 2px);
                font-size: clamp(0.8rem, 3.4vw, 1.6rem);
                text-align: center;
                min-width: 0;
                max-width: 100%;
                overflow-wrap: anywhere;
                word-break: break-word;
                text-transform: uppercase;
            }

            /* --- CONTAINER (Registration) --- */
            .navbar,
            .container,
            .table-container-outer {
                margin-left: auto;
                margin-right: auto;
            }

            .container {
                background-color: white;
                padding: clamp(18px, 4vw, 30px);
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                width: calc(100% - 24px);
                max-width: 600px;
                margin-bottom: 20px;
                box-sizing: border-box;
            }

            h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 25px;
                font-size: 1.5rem;
            }

            /* --- FORM INPUT --- */
            .input-group {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin-bottom: 20px;
            }

            input[type="text"],
            select {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                transition: border-color 0.3s;
                box-sizing: border-box;
            }

            input[type="text"]:focus,
            select:focus {
                outline: none;
                border-color: #3498db;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #34495e;
                font-size: 0.9rem;
            }

            /* --- BUTTONS --- */
            .btn-group {
                display: flex;
                gap: 12px;
                margin-top: 10px;
            }

            .btn-action {
                flex: 1;
                padding: 15px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition:
                    transform 0.1s,
                    background-color 0.3s;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .btn-submit {
                background-color: #27ae60;
                width: 100%;
            }
            .btn-submit:hover {
                background-color: #219150;
            }

            .btn-action:active {
                transform: scale(0.98);
            }

            /* --- TABLE --- */
            .table-container-outer {
                width: calc(100% - 24px);
                max-width: 1000px;
                background: white;
                border-radius: 12px;
                padding: clamp(14px, 3vw, 25px);
                box-sizing: border-box;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                overflow-wrap: anywhere;
            }

            .table-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                color: #2c3e50;
                font-weight: bold;
                font-size: 1.2rem;
            }

            .table-container {
                width: 100%;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }

            img,
            svg,
            video {
                max-width: 100%;
            }

            svg {
                flex: 0 0 auto;
            }

            th {
                background-color: #34495e;
                color: white;
                padding: 12px;
                text-align: left;
                font-size: 0.9rem;
            }

            td {
                padding: 12px;
                border-bottom: 1px solid #eee;
                color: #2c3e50;
                overflow-wrap: anywhere;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            /* --- ANIMASI BARIS BARU --- */
            tr {
                animation: fadeIn 0.5s ease-in;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                tr {
                    animation: none;
                }
            }

            @media (max-width: 700px) {
                .table-container table {
                    min-width: 100%;
                }
            }

            @media (max-width: 600px) {
                body {
                    padding: 12px;
                    background-attachment: scroll;
                }

                .navbar {
                    padding: 10px 48px;
                    border-radius: 10px;
                }

                .home-link {
                    left: 12px;
                    font-size: 21px;
                }

                .nav-title {
                    font-size: clamp(0.78rem, 3.4vw, 1.2rem);
                    letter-spacing: 0.5px;
                }

                h2 {
                    font-size: 1.2rem;
                    margin-bottom: 18px;
                }

                .btn-group {
                    flex-direction: column;
                }

                .table-header {
                    flex-wrap: wrap;
                    gap: 8px;
                }

                th,
                td {
                    padding: 10px 9px;
                }
            }

            @media (max-width: 400px) {
                body {
                    padding: 9px;
                }

                .navbar {
                    padding-left: 42px;
                    padding-right: 42px;
                }

                .table-container-outer {
                    padding: 12px;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link"
                ><i class="fa-solid fa-arrow-left"></i
            ></a>
            <span class="nav-title">CONFIRMATION LIST</span>
        </div>

        <div class="container" id="registrationContainer">
            <h2><i class="fa-solid fa-user-pen"></i> Registration Form</h2>
            <form id="playerForm">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Enter name..."
                        required
                    />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="posisi">
                        <option value="GK">GK</option>
                        <option value="CB">CB</option>
                        <option value="LB">LB</option>
                        <option value="RB">RB</option>
                        <option value="DMF">DMF</option>
                        <option value="CMF">CMF</option>
                        <option value="AMF">AMF</option>
                        <option value="LWF">LWF</option>
                        <option value="RWF">RWF</option>
                        <option value="CF">CF</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-submit">
                        <i class="fa-solid fa-check"></i> SIGN ME UP!
                    </button>
                </div>
            </form>
        </div>

        <div class="table-container-outer">
            <div class="table-header">
                <span
                    ><i class="fa-solid fa-users"></i> Registered
                    Attendees</span
                >
                <span
                    style="
                        background: #27ae60;
                        color: white;
                        padding: 6px 18px;
                        border-radius: 20px;
                    "
                    id="count"
                    >0</span
                >
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center">NO</th>
                            <th>NAME</th>
                            <th>POS</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="auth-guard.js"></script>
        <script>
            const _supabase = window.KOP.supabase;
            let context;

            const tableBody = document.getElementById("playerTableBody");
            const playerCount = document.getElementById("count");

            async function muatPemain() {
                const { data, error } = await _supabase
                    .from("community_players")
                    .select("*")
                    .eq("community_id", context.community.id)
                    .order("created_at", { ascending: true });
                if (error) return;

                tableBody.innerHTML = "";
                playerCount.innerText = data.length;

                if (!data.length) {
                    tableBody.innerHTML =
                        '<tr><td colspan="3" class="empty-state">Belum ada peserta terdaftar.</td></tr>';
                    return;
                }

                data.forEach((p, index) => {
                    tableBody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td style="font-weight: 600;">${window.KOP.escapeHtml(p.name)}</td>
                        <td><span style="color: #27ae60; font-weight: 800; font-size: 0.9rem;">${window.KOP.escapeHtml(p.position)}</span></td>
                    </tr>`;
                });
            }

            async function isiNamaPemain() {
                const input = document.getElementById("nama");
                const { data: profile } = await _supabase
                    .from("profiles")
                    .select("full_name")
                    .eq("id", context.user.id)
                    .maybeSingle();
                input.value = profile?.full_name || context.user.email?.split("@")[0] || "";
            }

            document
                .getElementById("playerForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    if (!context) return;
                    const nama = document.getElementById("nama").value.trim();
                    const posisi = document.getElementById("posisi").value;
                    if (!nama) return;
                    const { error } = await _supabase.rpc("register_community_player", {
                        p_community: context.community.id,
                        p_name: nama,
                        p_position: posisi,
                    });
                    if (!error) {
                        alert("Registered successfully!");
                        muatPemain();
                    } else {
                        alert("Registration failed: " + error.message);
                    }
                });

            window.onload = async () => {
                context = await window.KOP.auth.getContext({ requireCommunity: true });
                if (context) {
                    await isiNamaPemain();
                    muatPemain();
                }
            };
        </script>
    </body>
</html>
