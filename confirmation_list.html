<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Day - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />

        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                /* Mempertahankan Background Image */
                background:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("geminix.jpg");
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-size: cover;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 1000px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 75px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                position: relative;
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 26px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: #e74c3c;
            }

            .nav-title {
                color: white;
                font-weight: 900;
                letter-spacing: 2px;
                font-size: 1.6rem;
                text-transform: uppercase;
            }

            /* --- CONTAINER (Registration) --- */
            .container {
                background-color: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 600px;
                margin-bottom: 25px;
                box-sizing: border-box;
            }

            h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 25px;
                font-size: 1.5rem;
            }

            /* --- FORM INPUT --- */
            .input-group {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin-bottom: 20px;
            }

            input[type="text"],
            select {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                transition: border-color 0.3s;
                box-sizing: border-box;
            }

            input[type="text"]:focus,
            select:focus {
                outline: none;
                border-color: #3498db;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #34495e;
                font-size: 0.9rem;
            }

            /* --- BUTTONS --- */
            .btn-group {
                display: flex;
                gap: 12px;
                margin-top: 10px;
            }

            .btn-action {
                flex: 1;
                padding: 15px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition:
                    transform 0.1s,
                    background-color 0.3s;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .btn-submit {
                background-color: #27ae60;
                width: 100%;
            }
            .btn-submit:hover {
                background-color: #219150;
            }

            .btn-action:active {
                transform: scale(0.98);
            }

            /* --- TABLE --- */
            .table-container-outer {
                width: 100%;
                max-width: 1000px;
                background: white;
                border-radius: 12px;
                padding: 25px;
                box-sizing: border-box;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            }

            .table-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                color: #2c3e50;
                font-weight: bold;
                font-size: 1.2rem;
            }

            .table-container {
                width: 100%;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }

            th {
                background-color: #34495e;
                color: white;
                padding: 12px;
                text-align: left;
                font-size: 0.9rem;
            }

            td {
                padding: 12px;
                border-bottom: 1px solid #eee;
                color: #2c3e50;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            /* --- ANIMASI BARIS BARU --- */
            tr {
                animation: fadeIn 0.5s ease-in;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 600px) {
                .btn-group {
                    flex-direction: column;
                }
                .nav-title {
                    font-size: 1.2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link"
                ><i class="fa-solid fa-arrow-left"></i
            ></a>
            <span class="nav-title">CONFIRMATION LIST</span>
        </div>

        <div class="container" id="registrationContainer">
            <h2><i class="fa-solid fa-user-pen"></i> Registration Form</h2>
            <form id="playerForm">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Enter name..."
                        required
                    />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="posisi">
                        <option value="GK">GK</option>
                        <option value="CB">CB</option>
                        <option value="LB">LB</option>
                        <option value="RB">RB</option>
                        <option value="DMF">DMF</option>
                        <option value="CMF">CMF</option>
                        <option value="AMF">AMF</option>
                        <option value="LWF">LWF</option>
                        <option value="RWF">RWF</option>
                        <option value="CF">CF</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-submit">
                        <i class="fa-solid fa-check"></i> SIGN ME UP!
                    </button>
                </div>
            </form>
        </div>

        <div class="table-container-outer">
            <div class="table-header">
                <span
                    ><i class="fa-solid fa-users"></i> Registered
                    Attendees</span
                >
                <span
                    style="
                        background: #27ae60;
                        color: white;
                        padding: 6px 18px;
                        border-radius: 20px;
                    "
                    id="count"
                    >0</span
                >
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center">NO</th>
                            <th>NAME</th>
                            <th>POS</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const tableBody = document.getElementById("playerTableBody");
            const playerCount = document.getElementById("count");

            async function muatPemain() {
                const { data, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .order("created_at", { ascending: true });
                if (error) return;

                tableBody.innerHTML = "";
                playerCount.innerText = data.length;

                data.forEach((p, index) => {
                    tableBody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td style="font-weight: 600;">${p.nama}</td>
                        <td><span style="color: #27ae60; font-weight: 800; font-size: 0.9rem;">${p.posisi}</span></td>
                    </tr>`;
                });
            }

            document
                .getElementById("playerForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const nama = document.getElementById("nama").value;
                    const posisi = document.getElementById("posisi").value;
                    const { error } = await _supabase
                        .from("pemain")
                        .insert([{ nama, posisi }]);
                    if (!error) {
                        alert("Registered successfully!");
                        document.getElementById("playerForm").reset();
                        muatPemain();
                    }
                });

            window.onload = muatPemain;
        </script>
    </body>
</html>
