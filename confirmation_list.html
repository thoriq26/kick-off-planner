<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Day - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />

        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                /* Mempertahankan Background Image */
                background:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("gemini.jpg");
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-size: cover;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 1000px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 75px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                position: relative;
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 26px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: #e74c3c;
            }

            .admin-login-btn {
                position: absolute;
                right: 20px;
                background: transparent;
                border: 2px solid rgba(255, 255, 255, 0.5);
                color: white;
                padding: 6px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
            }
            .admin-login-btn:hover {
                border-color: #27ae60;
                color: #27ae60;
            }
            .admin-login-btn.active {
                border-color: #27ae60;
                background: #27ae60;
                color: white;
            }
            .nav-title {
                color: white;
                font-weight: 900;
                letter-spacing: 2px;
                font-size: 1.6rem;
                text-transform: uppercase;
            }

            /* --- CONTAINERS (Registration & Edit) --- */
            .container {
                background-color: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 600px;
                margin-bottom: 25px;
                box-sizing: border-box;
            }

            #editContainer {
                display: none; /* Hidden by default */
                border: 3px solid #27ae60;
            }

            h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 25px;
                font-size: 1.5rem;
            }

            /* --- FORM INPUT --- */
            .input-group {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin-bottom: 20px;
            }

            input[type="text"],
            select {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                transition: border-color 0.3s;
                box-sizing: border-box;
            }

            input[type="text"]:focus,
            select:focus {
                outline: none;
                border-color: #3498db;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #34495e;
                font-size: 0.9rem;
            }

            /* --- BUTTONS --- */
            .btn-group {
                display: flex;
                gap: 12px;
                margin-top: 10px;
            }

            .btn-action {
                flex: 1;
                padding: 15px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition:
                    transform 0.1s,
                    background-color 0.3s;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .btn-submit {
                background-color: #27ae60;
                width: 100%;
            }
            .btn-submit:hover {
                background-color: #219150;
            }

            .btn-update {
                background-color: #2980b9;
            }
            .btn-update:hover {
                background-color: #2471a3;
            }

            .btn-cancel {
                background-color: #95a5a6;
            }
            .btn-cancel:hover {
                background-color: #7f8c8d;
            }

            .btn-reset {
                background-color: #e74c3c;
                display: none;
            }
            .btn-reset:hover {
                background-color: #c0392b;
            }

            .btn-action:active {
                transform: scale(0.98);
            }

            /* --- TABLE --- */
            .table-container-outer {
                width: 100%;
                max-width: 1000px;
                background: white;
                border-radius: 12px;
                padding: 25px;
                box-sizing: border-box;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            }

            .table-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                color: #2c3e50;
                font-weight: bold;
                font-size: 1.2rem;
            }

            .table-container {
                width: 100%;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }

            th {
                background-color: #34495e;
                color: white;
                padding: 12px;
                text-align: left;
                font-size: 0.9rem;
            }

            td {
                padding: 12px;
                border-bottom: 1px solid #eee;
                color: #2c3e50;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            /* --- ANIMASI BARIS BARU --- */
            tr {
                animation: fadeIn 0.5s ease-in;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Action Buttons in Table */
            .action-header,
            .action-cell {
                display: none;
            }
            .action-cell {
                gap: 8px;
            }

            .btn-table {
                width: 35px;
                height: 35px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: 0.2s;
            }
            .btn-edit {
                background: #27ae60;
            }
            .btn-delete {
                background: #e74c3c;
            }
            .btn-table:hover {
                opacity: 0.8;
            }

            @media (max-width: 600px) {
                .btn-group {
                    flex-direction: column;
                }
                .nav-title {
                    font-size: 1.2rem;
                }
                .admin-login-btn span {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link"
                ><i class="fa-solid fa-arrow-left"></i
            ></a>
            <span class="nav-title">CONFIRMATION LIST</span>
            <button
                id="adminToggle"
                class="admin-login-btn"
                onclick="toggleAdminMode()"
            >
                <i id="lockIcon" class="fa-solid fa-lock"></i>
                <span>LOGIN</span>
            </button>
        </div>

        <div class="container" id="registrationContainer">
            <h2><i class="fa-solid fa-user-pen"></i> Registration Form</h2>
            <form id="playerForm">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Enter name..."
                        required
                    />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="posisi">
                        <option value="GK">GK</option>
                        <option value="CB">CB</option>
                        <option value="LB">LB</option>
                        <option value="RB">RB</option>
                        <option value="DMF">DMF</option>
                        <option value="CMF">CMF</option>
                        <option value="AMF">AMF</option>
                        <option value="LWF">LWF</option>
                        <option value="RWF">RWF</option>
                        <option value="CF">CF</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-submit">
                        <i class="fa-solid fa-check"></i> SIGN ME UP!
                    </button>
                    <button
                        type="button"
                        id="resetBtn"
                        class="btn-action btn-reset"
                        onclick="resetDatabase()"
                    >
                        <i class="fa-solid fa-rotate"></i> RESET ALL
                    </button>
                </div>
            </form>
        </div>

        <div class="container" id="editContainer">
            <h2 style="color: #27ae60">
                <i class="fa-solid fa-pen-to-square"></i> Edit Participant
            </h2>
            <form id="editForm">
                <input type="hidden" id="editId" />
                <div class="input-group">
                    <label>NAME</label>
                    <input type="text" id="editNama" required />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="editPosisi">
                        <option value="GK">GK</option>
                        <option value="CB">CB</option>
                        <option value="LB">LB</option>
                        <option value="RB">RB</option>
                        <option value="DMF">DMF</option>
                        <option value="CMF">CMF</option>
                        <option value="AMF">AMF</option>
                        <option value="LWF">LWF</option>
                        <option value="RWF">RWF</option>
                        <option value="CF">CF</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-update">
                        <i class="fa-solid fa-floppy-disk"></i> UPDATE DATA
                    </button>
                    <button
                        type="button"
                        class="btn-action btn-cancel"
                        onclick="cancelEdit()"
                    >
                        CANCEL
                    </button>
                </div>
            </form>
        </div>

        <div class="table-container-outer">
            <div class="table-header">
                <span
                    ><i class="fa-solid fa-users"></i> Registered
                    Attendees</span
                >
                <span
                    style="
                        background: #27ae60;
                        color: white;
                        padding: 6px 18px;
                        border-radius: 20px;
                    "
                    id="count"
                    >0</span
                >
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center">NO</th>
                            <th>NAME</th>
                            <th>POS</th>
                            <th
                                id="actionHeader"
                                class="action-header"
                                style="width: 100px"
                            >
                                ACTION
                            </th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            // Logika Supabase dan Admin tetap sama seperti sebelumnya
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const tableBody = document.getElementById("playerTableBody");
            const playerCount = document.getElementById("count");
            const editContainer = document.getElementById("editContainer");
            const regContainer = document.getElementById(
                "registrationContainer",
            );
            let isAdminLoggedIn = false;

            function toggleAdminMode() {
                if (!isAdminLoggedIn) {
                    const pin = prompt("Admin Password:");
                    if (pin === "admin") {
                        isAdminLoggedIn = true;
                        applyAdminUI();
                        alert("Login Successful!");
                    } else if (pin !== null) {
                        alert("Access Denied!");
                    }
                } else {
                    if (confirm("Sign out from Admin mode?")) {
                        isAdminLoggedIn = false;
                        cancelEdit();
                        applyAdminUI();
                    }
                }
            }

            function applyAdminUI() {
                const btn = document.getElementById("adminToggle");
                const resetBtn = document.getElementById("resetBtn");
                const actionHeader = document.getElementById("actionHeader");

                if (isAdminLoggedIn) {
                    btn.innerHTML =
                        '<i class="fa-solid fa-lock-open"></i> <span>ADMIN</span>';
                    btn.classList.add("active");
                    resetBtn.style.display = "flex";
                    actionHeader.style.display = "table-cell";
                } else {
                    btn.innerHTML =
                        '<i class="fa-solid fa-lock"></i> <span>LOGIN</span>';
                    btn.classList.remove("active");
                    resetBtn.style.display = "none";
                    actionHeader.style.display = "none";
                }
                muatPemain();
            }

            async function muatPemain() {
                const { data, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .order("created_at", { ascending: true });
                if (error) return;

                tableBody.innerHTML = "";
                playerCount.innerText = data.length;

                data.forEach((p, index) => {
                    tableBody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td style="font-weight: 600;">${p.nama}</td>
                        <td><span style="color: #27ae60; font-weight: 800; font-size: 0.9rem;">${p.posisi}</span></td>
                        <td class="action-cell" style="display: ${isAdminLoggedIn ? "flex" : "none"}">
                            <button class="btn-table btn-edit" onclick="showEditForm(${p.id}, '${p.nama}', '${p.posisi}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-table btn-delete" onclick="hapusSatuPemain(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            }

            function showEditForm(id, nama, posisi) {
                regContainer.style.display = "none";
                editContainer.style.display = "block";
                document.getElementById("editId").value = id;
                document.getElementById("editNama").value = nama;
                document.getElementById("editPosisi").value = posisi;
                window.scrollTo({ top: 0, behavior: "smooth" });
            }

            function cancelEdit() {
                editContainer.style.display = "none";
                regContainer.style.display = "block";
                document.getElementById("editForm").reset();
            }

            document
                .getElementById("playerForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const nama = document.getElementById("nama").value;
                    const posisi = document.getElementById("posisi").value;
                    const { error } = await _supabase
                        .from("pemain")
                        .insert([{ nama, posisi }]);
                    if (!error) {
                        alert("Registered successfully!");
                        document.getElementById("playerForm").reset();
                        muatPemain();
                    }
                });

            document
                .getElementById("editForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const id = document.getElementById("editId").value;
                    const nama = document.getElementById("editNama").value;
                    const posisi = document.getElementById("editPosisi").value;
                    const { error } = await _supabase
                        .from("pemain")
                        .update({ nama, posisi })
                        .eq("id", id);
                    if (!error) {
                        alert("Data updated successfully!");
                        cancelEdit();
                        muatPemain();
                    }
                });

            async function hapusSatuPemain(id) {
                if (confirm("Remove attendee?")) {
                    await _supabase.from("pemain").delete().eq("id", id);
                    muatPemain();
                }
            }

            async function resetDatabase() {
                if (confirm("DANGER: RESET ALL DATA?")) {
                    const { data } = await _supabase
                        .from("pemain")
                        .select("id");
                    if (data?.length > 0) {
                        await _supabase
                            .from("pemain")
                            .delete()
                            .in(
                                "id",
                                data.map((p) => p.id),
                            );
                    }
                    muatPemain();
                }
            }

            window.onload = muatPemain;
        </script>
    </body>
</html>
