<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Day - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND FULL --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("DC98-transformed.jpeg");
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-size: cover;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR (CONFIRMATION LIST) --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 1000px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 75px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                position: relative;
            }

            /* Tombol Home - Hijau saat Hover/Klik */
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 26px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover,
            .home-link:active {
                color: #27ae60;
            }

            .nav-title {
                color: white;
                font-weight: 900;
                letter-spacing: 2px;
                font-size: 1.6rem;
                text-transform: uppercase;
            }

            /* --- REGISTRATION FORM (Ramping) --- */
            .container {
                background: rgba(255, 255, 255, 0.98);
                padding: 20px 30px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
                width: 100%;
                max-width: 750px; /* Lebih kecil agar tidak penuh layar */
                box-sizing: border-box;
                margin-bottom: 25px;
            }

            h2 {
                color: #2c3e50;
                text-align: center;
                margin: 0 0 15px 0;
                font-size: 1.2rem;
            }

            .input-group {
                margin-bottom: 12px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #34495e;
                font-size: 0.8rem;
            }
            input,
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 8px;
                box-sizing: border-box;
                font-size: 15px;
                outline: none;
            }

            .btn-group {
                display: flex;
                gap: 12px;
                margin: 15px 0 5px 0;
            }
            .btn-action {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: 50px;
                font-weight: bold;
                cursor: pointer;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                transition: 0.3s;
            }
            .btn-submit {
                background: #27ae60;
                color: white;
            }
            .btn-reset {
                background: #e74c3c;
                color: white;
            }

            /* --- TABLE SQUAD LIST (Tetap Gagah) --- */
            .table-container-outer {
                width: 100%;
                max-width: 1000px;
                background: rgba(255, 255, 255, 0.98);
                border-radius: 20px;
                padding: 25px;
                box-sizing: border-box;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            }
            .table-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                color: #2c3e50;
                font-weight: bold;
                font-size: 1.2rem;
            }
            .table-container {
                width: 100%;
                overflow-x: auto;
                border-radius: 12px;
                border: 1px solid #eee;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                background: white;
            }
            th {
                background: #34495e;
                color: white;
                padding: 18px;
                text-align: left;
                font-size: 0.9rem;
            }
            td {
                padding: 18px;
                border-bottom: 1px solid #eee;
                color: #2c3e50;
                font-size: 1rem;
            }

            .action-cell {
                display: flex;
                gap: 8px;
            }
            .btn-table {
                width: 38px;
                height: 38px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .btn-edit {
                background: #27ae60;
            }
            .btn-delete {
                background: #e74c3c;
            }

            @media (max-width: 600px) {
                .btn-group {
                    flex-direction: column;
                }
                .nav-title {
                    font-size: 1.2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link"
                ><i class="fa-solid fa-house"></i
            ></a>
            <span class="nav-title">CONFIRMATION LIST</span>
        </div>

        <div class="container">
            <h2><i class="fa-solid fa-user-pen"></i> Registration Form</h2>
            <form id="playerForm">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Enter name..."
                        required
                    />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="posisi">
                        <option value="GOALKEEPER (GK)">GOALKEEPER (GK)</option>
                        <option value="DEFENDER (DF)">DEFENDER (DF)</option>
                        <option value="MIDFIELDER (MF)">MIDFIELDER (MF)</option>
                        <option value="WINGER (WG)">WINGER (WG)</option>
                        <option value="STRIKER (CF)">STRIKER (CF)</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-submit">
                        <i class="fa-solid fa-check"></i> SIGN ME UP!
                    </button>
                    <button
                        type="button"
                        class="btn-action btn-reset"
                        onclick="resetDatabase()"
                    >
                        <i class="fa-solid fa-rotate"></i> RESET ALL
                    </button>
                </div>
            </form>
        </div>

        <div class="table-container-outer">
            <div class="table-header">
                <span><i class="fa-solid fa-users"></i> Registered Squad</span>
                <span
                    style="
                        background: #27ae60;
                        color: white;
                        padding: 6px 18px;
                        border-radius: 20px;
                    "
                    id="count"
                    >0</span
                >
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center">NO</th>
                            <th>NAME</th>
                            <th>POSITION</th>
                            <th style="width: 120px">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const tableBody = document.getElementById("playerTableBody");
            const playerCount = document.getElementById("count");

            function formatPosFull(pos) {
                const map = {
                    GK: "GOALKEEPER (GK)",
                    Kiper: "GOALKEEPER (GK)",
                    DF: "DEFENDER (DF)",
                    Bek: "DEFENDER (DF)",
                    MF: "MIDFIELDER (MF)",
                    Gelandang: "MIDFIELDER (MF)",
                    WG: "WINGER (WG)",
                    Winger: "WINGER (WG)",
                    CF: "STRIKER (CF)",
                    Striker: "STRIKER (CF)",
                    Penyerang: "STRIKER (CF)",
                    Fan: "SPECTATOR (FAN)",
                    Penonton: "SPECTATOR (FAN)",
                };
                return map[pos] || pos;
            }

            async function muatPemain() {
                const { data, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .order("created_at", { ascending: true });
                if (error) return;
                tableBody.innerHTML = "";
                playerCount.innerText = data.length;
                data.forEach((p, index) => {
                    const displayPos = formatPosFull(p.posisi);
                    tableBody.innerHTML += `
                        <tr>
                            <td style="text-align: center;">${index + 1}</td>
                            <td style="font-weight: 600;">${p.nama}</td>
                            <td><span style="color: #27ae60; font-weight: bold; font-size: 0.9rem;">${displayPos}</span></td>
                            <td>
                                <div class="action-cell">
                                    <button class="btn-table btn-edit" onclick="editPemain(${p.id}, '${p.nama}', '${displayPos}')">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button class="btn-table btn-delete" onclick="hapusSatuPemain(${p.id})">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>`;
                });
            }

            document
                .getElementById("playerForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const nama = document.getElementById("nama").value;
                    const posisi = document.getElementById("posisi").value;
                    await _supabase.from("pemain").insert([{ nama, posisi }]);
                    document.getElementById("playerForm").reset();
                    muatPemain();
                });

            function cekPinAdmin() {
                const pin = prompt("Admin PIN:");
                return pin === "admin" ? "OK" : "WRONG";
            }

            async function editPemain(id, namaLama, posisiLama) {
                if (cekPinAdmin() !== "OK") return alert("Wrong PIN!");
                const namaBaru = prompt("Edit Name:", namaLama);
                if (!namaBaru) return;
                const opsi = [
                    "GOALKEEPER (GK)",
                    "DEFENDER (DF)",
                    "MIDFIELDER (MF)",
                    "WINGER (WG)",
                    "STRIKER (CF)",
                    "SPECTATOR (FAN)",
                ];
                let msg =
                    "Select Position:\n" +
                    opsi.map((o, i) => `${i + 1}. ${o}`).join("\n");
                const p = prompt(msg, "1");
                let posisiBaru = p >= 1 && p <= 6 ? opsi[p - 1] : posisiLama;
                await _supabase
                    .from("pemain")
                    .update({ nama: namaBaru, posisi: posisiBaru })
                    .eq("id", id);
                muatPemain();
            }

            async function hapusSatuPemain(id) {
                if (cekPinAdmin() !== "OK") return alert("Wrong PIN!");
                if (confirm("Remove player?")) {
                    await _supabase.from("pemain").delete().eq("id", id);
                    muatPemain();
                }
            }

            async function resetDatabase() {
                if (cekPinAdmin() !== "OK") return alert("Wrong PIN!");
                if (confirm("Clear all data?")) {
                    const { data } = await _supabase
                        .from("pemain")
                        .select("id");
                    if (data?.length > 0) {
                        await _supabase
                            .from("pemain")
                            .delete()
                            .in(
                                "id",
                                data.map((p) => p.id),
                            );
                    }
                    muatPemain();
                }
            }

            window.onload = muatPemain;
        </script>
    </body>
</html>
