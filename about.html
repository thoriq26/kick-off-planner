<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Day - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />

        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("gemini.jpg");
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-size: cover;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 1000px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 75px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                position: relative;
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 26px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: red;
            }

            .admin-login-btn {
                position: absolute;
                right: 20px;
                background: transparent;
                border: 2px solid rgba(255, 255, 255, 0.5);
                color: white;
                padding: 6px 15px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
            }
            .admin-login-btn:hover {
                border-color: #27ae60;
                color: #27ae60;
            }
            .admin-login-btn.active {
                border-color: #27ae60;
                background: #27ae60;
                color: white;
            }
            .nav-title {
                color: white;
                font-weight: 900;
                letter-spacing: 2px;
                font-size: 1.6rem;
                text-transform: uppercase;
            }

            /* --- FORM --- */
            .container {
                background: rgba(255, 255, 255, 0.98);
                padding: 20px 30px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
                width: 100%;
                max-width: 750px;
                box-sizing: border-box;
                margin-bottom: 25px;
            }
            h2 {
                color: #2c3e50;
                text-align: center;
                margin: 0 0 15px 0;
                font-size: 1.2rem;
            }
            .input-group {
                margin-bottom: 12px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #34495e;
                font-size: 0.8rem;
            }
            input,
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 15px;
                outline: none;
            }
            .btn-group {
                display: flex;
                gap: 12px;
                margin: 15px 0 5px 0;
            }
            .btn-action {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: 50px;
                font-weight: bold;
                cursor: pointer;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                transition: 0.3s;
            }
            .btn-submit {
                background: #27ae60;
                color: white;
                width: 100%;
            }
            .btn-reset {
                background: #e74c3c;
                color: white;
                display: none;
            }

            /* --- TABLE --- */
            .table-container-outer {
                width: 100%;
                max-width: 1000px;
                background: rgba(255, 255, 255, 0.98);
                border-radius: 20px;
                padding: 25px;
                box-sizing: border-box;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            }
            .table-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                color: #2c3e50;
                font-weight: bold;
                font-size: 1.2rem;
            }
            .table-container {
                width: 100%;
                overflow-x: auto;
                border-radius: 12px;
                border: 1px solid #eee;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                background: white;
            }
            th {
                background: #34495e;
                color: white;
                padding: 18px;
                text-align: left;
                font-size: 0.9rem;
            }
            td {
                padding: 18px;
                border-bottom: 1px solid #eee;
                color: #2c3e50;
                font-size: 1rem;
            }

            .action-header,
            .action-cell {
                display: none;
            }
            .action-cell {
                gap: 8px;
            }
            .btn-table {
                width: 38px;
                height: 38px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .btn-edit {
                background: #27ae60;
            }
            .btn-delete {
                background: #e74c3c;
            }

            @media (max-width: 600px) {
                .btn-group {
                    flex-direction: column;
                }
                .nav-title {
                    font-size: 1.2rem;
                }
                .admin-login-btn span {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link"
                ><i class="fa-solid fa-arrow-left"></i
            ></a>
            <span class="nav-title">CONFIRMATION LIST</span>
            <button
                id="adminToggle"
                class="admin-login-btn"
                onclick="toggleAdminMode()"
            >
                <i id="lockIcon" class="fa-solid fa-lock"></i>
                <span>LOGIN</span>
            </button>
        </div>

        <div class="container">
            <h2><i class="fa-solid fa-user-pen"></i> Registration Form</h2>
            <form id="playerForm">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Enter name..."
                        required
                    />
                </div>
                <div class="input-group">
                    <label>POSITION</label>
                    <select id="posisi">
                        <option value="GK">GK</option>
                        <option value="CB">CB</option>
                        <option value="LB">LB</option>
                        <option value="RB">RB</option>
                        <option value="DMF">DMF</option>
                        <option value="CMF">CMF</option>
                        <option value="AMF">AMF</option>
                        <option value="LWF">LWF</option>
                        <option value="RWF">RWF</option>
                        <option value="CF">CF</option>
                        <option value="SPECTATOR (FAN)">SPECTATOR (FAN)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-action btn-submit">
                        <i class="fa-solid fa-check"></i> SIGN ME UP!
                    </button>
                    <button
                        type="button"
                        id="resetBtn"
                        class="btn-action btn-reset"
                        onclick="resetDatabase()"
                    >
                        <i class="fa-solid fa-rotate"></i> RESET ALL
                    </button>
                </div>
            </form>
        </div>

        <div class="table-container-outer">
            <div class="table-header">
                <span
                    ><i class="fa-solid fa-users"></i> Registered
                    Attendees</span
                >
                <span
                    style="
                        background: #27ae60;
                        color: white;
                        padding: 6px 18px;
                        border-radius: 20px;
                    "
                    id="count"
                    >0</span
                >
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center">NO</th>
                            <th>NAME</th>
                            <th>POS</th>
                            <th
                                id="actionHeader"
                                class="action-header"
                                style="width: 120px"
                            >
                                ACTION
                            </th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const tableBody = document.getElementById("playerTableBody");
            const playerCount = document.getElementById("count");
            let isAdminLoggedIn = false;

            // --- LOGIKA MENGGUNAKAN GAYA BAWAAN BROWSER ---
            function toggleAdminMode() {
                if (!isAdminLoggedIn) {
                    // Pakai prompt bawaan
                    const pin = prompt("Admin Password:");

                    if (pin === "admin") {
                        isAdminLoggedIn = true;
                        applyAdminUI();
                        alert("Login Successful! You are now in Admin mode");
                    } else if (pin !== null) {
                        alert("Access Denied! Incorrect Password.");
                    }
                } else {
                    // Pakai confirm bawaan
                    if (confirm("Sign out from Admin mode?")) {
                        isAdminLoggedIn = false;
                        applyAdminUI();
                    }
                }
            }

            function applyAdminUI() {
                const btn = document.getElementById("adminToggle");
                const resetBtn = document.getElementById("resetBtn");
                const actionHeader = document.getElementById("actionHeader");

                if (isAdminLoggedIn) {
                    btn.innerHTML =
                        '<i class="fa-solid fa-lock-open"></i> <span>ADMIN</span>';
                    btn.classList.add("active");
                    resetBtn.style.display = "flex";
                    actionHeader.style.display = "table-cell";
                } else {
                    btn.innerHTML =
                        '<i class="fa-solid fa-lock"></i> <span>LOGIN</span>';
                    btn.classList.remove("active");
                    resetBtn.style.display = "none";
                    actionHeader.style.display = "none";
                }
                muatPemain();
            }

            async function muatPemain() {
                const { data, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .order("created_at", { ascending: true });
                if (error) return;

                tableBody.innerHTML = "";
                playerCount.innerText = data.length;

                data.forEach((p, index) => {
                    tableBody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td style="font-weight: 600;">${p.nama}</td>
                        <td><span style="color: #27ae60; font-weight: 800; font-size: 0.9rem;">${p.posisi}</span></td>
                        <td class="action-cell" style="display: ${isAdminLoggedIn ? "flex" : "none"}">
                            <button class="btn-table btn-edit" onclick="editPemain(${p.id}, '${p.nama}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-table btn-delete" onclick="hapusSatuPemain(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            }

            document
                .getElementById("playerForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const nama = document.getElementById("nama").value;
                    const posisi = document.getElementById("posisi").value;
                    const { error } = await _supabase
                        .from("pemain")
                        .insert([{ nama, posisi }]);
                    if (!error) {
                        alert("Success!\nRegistered successfully");
                        document.getElementById("playerForm").reset();
                        muatPemain();
                    }
                });

            async function editPemain(id, namaLama) {
                const namaBaru = prompt("Edit Player Name:", namaLama);
                if (namaBaru !== null && namaBaru.trim() !== "") {
                    await _supabase
                        .from("pemain")
                        .update({ nama: namaBaru })
                        .eq("id", id);
                    muatPemain();
                }
            }

            async function hapusSatuPemain(id) {
                if (confirm("Remove attendee? This action cannot be undone.")) {
                    await _supabase.from("pemain").delete().eq("id", id);
                    muatPemain();
                }
            }

            async function resetDatabase() {
                if (
                    confirm(
                        "DANGER: RESET ALL DATA?\nThis will clear the entire list.",
                    )
                ) {
                    const { data } = await _supabase
                        .from("pemain")
                        .select("id");
                    if (data?.length > 0) {
                        await _supabase
                            .from("pemain")
                            .delete()
                            .in(
                                "id",
                                data.map((p) => p.id),
                            );
                    }
                    muatPemain();
                }
            }

            window.onload = muatPemain;
        </script>
    </body>
</html>
