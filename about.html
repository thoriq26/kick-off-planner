<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kehadiran - DC98</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            body {
                font-family: "Segoe UI", sans-serif;
                /* --- PENAMBAHAN BACKGROUND --- */
                background-image: url("DC98-transformed.jpeg");
                background-size: 99%; /* Sesuai permintaan */
                background-position: center;
                background-attachment: fixed;
                background-repeat: no-repeat;
                background-color: #f0f2f5;

                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            /* NAVBAR */
            .navbar {
                background: #34495e;
                width: 100%;
                max-width: 800px;
                border-radius: 10px;
                margin-bottom: 20px;
                position: relative;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .home-box {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
            }

            .home-link {
                font-size: 24px;
                color: white;
                text-decoration: none;
            }

            .li-navbar a {
                color: white;
                text-decoration: none;
                font-weight: bold;
            }

            .btn-active-nav {
                background-color: #f39c12 !important;
                padding: 6px 20px;
                border-radius: 5px;
                color: white !important;
            }

            /* KONTEN UTAMA */
            .container {
                /* MODIFIKASI: Ditambah transparansi (0.9) agar background terlihat */
                background: rgba(255, 255, 255, 0.9);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 800px;
                text-align: center;
                box-sizing: border-box;
            }

            h2 {
                color: #2c3e50;
            }
            #statusSlot {
                font-weight: bold;
                font-size: 18px;
                margin-bottom: 20px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 20px;
            }

            input,
            select,
            .btn {
                padding: 12px;
                border-radius: 8px;
                border: 2px solid #ddd;
                font-size: 16px;
            }

            .btn {
                background-color: #27ae60;
                color: white;
                border: none;
                cursor: pointer;
                font-weight: bold;
                transition: 0.3s;
            }
            .btn:hover {
                background-color: #219150;
            }

            .btn-reset {
                background: #e74c3c;
                margin-top: 5px;
            }
            .btn-reset:hover {
                background: #c0392b;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                background: white;
                border-radius: 10px;
                overflow: hidden;
            }
            th,
            td {
                padding: 12px;
                border-bottom: 1px solid #eee;
                text-align: center;
            }
            th {
                background: #34495e;
                color: white;
            }
            tr:nth-child(even) {
                background-color: #f9f9f9;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            <ul style="list-style: none; padding: 0">
                <li class="li-navbar">
                    <a href="about.html" class="btn-active-nav">Kehadiran</a>
                </li>
            </ul>
        </div>

        <div class="container">
            <h2>Daftar Kehadiran</h2>
            <p id="statusSlot">Memuat kuota...</p>

            <div class="form-group">
                <input
                    type="text"
                    id="inputNama"
                    placeholder="Nama Pemain..."
                />
                <select id="pilihPosisi">
                    <option value="Kiper">Kiper</option>
                    <option value="Bek">Bek</option>
                    <option value="Gelandang">Gelandang</option>
                    <option value="Sayap">Sayap</option>
                    <option value="Penyerang">Penyerang</option>
                    <option value="Penonton">Penonton</option>
                </select>
                <button class="btn" onclick="tambahPemain()">
                    Saya Ikut Main!
                </button>
                <button class="btn btn-reset" onclick="resetData()">
                    Reset Daftar
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Posisi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody"></tbody>
            </table>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <script>
            // KONFIGURASI SUPABASE
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";

            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let daftarPemain = [];

            async function fetchPemain() {
                const { data, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .order("created_at", { ascending: true });

                if (error) {
                    console.error("Gagal mengambil data:", error);
                    document.getElementById("statusSlot").innerText =
                        "Gagal memuat data!";
                } else {
                    daftarPemain = data;
                    renderTabel();
                }
            }

            async function tambahPemain() {
                const nama = document.getElementById("inputNama").value.trim();
                const posisi = document.getElementById("pilihPosisi").value;

                if (nama === "") return alert("Mohon isi nama kamu!");
                if (daftarPemain.length >= 20) return alert("Kuota penuh!");

                const { error } = await _supabase
                    .from("pemain")
                    .insert([{ nama: nama, posisi: posisi }]);

                if (error) {
                    alert("Gagal mendaftar: " + error.message);
                } else {
                    document.getElementById("inputNama").value = "";
                    fetchPemain();
                }
            }

            async function resetData() {
                const passwordAdmin = "admin";
                const inputUser = prompt(
                    "Masukkan Password Admin untuk mereset daftar:",
                );

                if (inputUser === passwordAdmin) {
                    if (
                        confirm(
                            "Apakah Anda yakin ingin menghapus SEMUA daftar pemain?",
                        )
                    ) {
                        const { error } = await _supabase
                            .from("pemain")
                            .delete()
                            .neq("id", 0);

                        if (error) {
                            alert("Gagal reset data!");
                        } else {
                            alert("Daftar berhasil dikosongkan.");
                            fetchPemain();
                        }
                    }
                } else if (inputUser !== null) {
                    alert("Password Salah!");
                }
            }

            function renderTabel() {
                const tbody = document.getElementById("tabelBody");
                tbody.innerHTML = "";
                daftarPemain.forEach((p, i) => {
                    tbody.innerHTML += `<tr><td>${i + 1}</td><td>${p.nama}</td><td>${p.posisi}</td></tr>`;
                });

                const sisaSlot = 20 - daftarPemain.length;
                const statusEl = document.getElementById("statusSlot");
                statusEl.innerText = `Slot tersedia: ${sisaSlot}`;
                statusEl.style.color = sisaSlot <= 0 ? "#e74c3c" : "#27ae60";
            }

            _supabase
                .channel("pemain_changes")
                .on(
                    "postgres_changes",
                    { event: "*", schema: "public", table: "pemain" },
                    () => {
                        fetchPemain();
                    },
                )
                .subscribe();

            window.onload = fetchPemain;
        </script>
    </body>
</html>
