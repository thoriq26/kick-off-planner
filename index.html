<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KickOff Planner</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            /* Container utama untuk tombol agar bisa sejajar */
            .button-menu {
                display: flex;
                flex-direction: row; /* Memaksa ke samping */
                flex-wrap: wrap; /* Supaya kalau layar sempit, dia turun rapi */
                justify-content: center;
                align-items: stretch;
                gap: 15px; /* Jarak antar tombol */
                width: 100%;
                max-width: 1000px; /* Batas lebar maksimal area tombol */
                margin: 20px auto;
                padding: 0 10px;
            }

            /* Menyamakan ukuran semua tombol di dalam menu */
            .button-menu .button {
                flex: 1; /* Semua tombol membagi ruang yang sama rata */
                min-width: 160px; /* Lebar minimal supaya teks tidak berdesakan */
                margin: 0 !important; /* Reset margin bawaan style.css jika ada */
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                height: 60px; /* Samakan tinggi semua tombol */
                font-weight: bold;
                text-decoration: none;
                transition: all 0.3s ease;
            }

            /* Styling khusus Button History agar tetap beda warnanya tapi ukuran sama */
            .btn-history {
                background-color: #2c3e50 !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
            }

            .btn-history:hover {
                background-color: #34495e !important;
                transform: scale(1.05);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            .btn-history:active {
                transform: scale(0.95);
            }

            /* Setting khusus untuk layar HP (Mobile) */
            @media (max-width: 768px) {
                .button-menu .button {
                    flex: 1 1 calc(50% - 20px); /* Jadi 2 baris (2 tombol per baris) */
                }
            }

            @media (max-width: 480px) {
                .button-menu .button {
                    flex: 1 1 100%; /* Jadi 1 kolom saja kalau layar sangat kecil */
                }
            }
        </style>
    </head>
    <body>
        <div class="container-utama">
            <nav class="navbar-content">
                <img class="logo" src="favicon.ico" alt="Logo" />

                <header class="hero">
                    <h1>KickOff Planner</h1>
                    <p>Sepak Bola Menyatukan Kita Semua</p>
                </header>
            </nav>

            <main class="isi-konten">
                <div class="button-menu">
                    <a class="button" href="about.html">CONFIRMATION LIST</a>
                    <a class="button" href="otomatis.html">TEAM DRAFT</a>
                    <a class="button" href="maps.html">MATCH DAY</a>
                    <a class="button btn-history" href="history.html"
                        >EVENT HISTORY</a
                    >
                </div>
            </main>

            <footer class="footer">
                <h1 class="h1-footer">KickOff Planner © 2026 by Thoriq.</h1>
            </footer>
        </div>
    </body>
</html>
