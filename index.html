<!doctype html>
<html lang="id">
    <head>
        <link rel="icon" type="image/svg+xml" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KickOff Planner</title>
        <style>
            /* --- RESET & DASAR --- */
            *,
            html {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Helvetica Neue", Arial, sans-serif;
                overflow-x: hidden;
            }

            /* --- CONTAINER UTAMA --- */
            .container-utama {
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("Geminix.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                width: 100%;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* --- NAVBAR & HERO --- */
            .navbar-content {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                position: sticky;
                top: 0;
                z-index: 1000;
            }

            /* LOGO RESPONSIVE POJOK KIRI ATAS */
            .logo {
                position: absolute;
                left: 20px;
                top: 20px;
                width: 60px;
                height: auto;
                transition: all 0.3s ease;
            }

            .hero {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                color: white;
                padding: 15px 30px;
                border-radius: 15px;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 128, 0, 0.8),
                    rgba(0, 0, 0, 0.6)
                );
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(5px);
            }

            .hero h1 {
                font-size: clamp(1.5rem, 5vw, 3rem);
                margin: 0;
                text-shadow: 2px 2px 10px black;
            }

            .hero p {
                font-size: clamp(0.8rem, 2vw, 1.1rem);
                margin-top: 5px;
                text-shadow: 2px 2px 10px black;
            }

            /* --- ISI KONTEN (TOMBOL) --- */
            .isi-konten {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .button-menu {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                width: 100%;
                max-width: 1000px;
                margin: 0 auto;
            }

            .button {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: #e0e0e0;
                min-width: 220px;
                height: 60px; /* Tinggi seragam */
                padding: 10px 25px;
                font-weight: 700;
                border-radius: 12px;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 128, 0, 0.9),
                    rgba(0, 0, 0, 0.7)
                );
                text-decoration: none;
                transition: all 0.3s ease;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .button:hover {
                color: white;
                transform: translateY(-5px);
                box-shadow: 0 8px 25px rgba(0, 128, 0, 0.4);
                background: linear-gradient(
                    to bottom,
                    rgba(0, 150, 0, 1),
                    rgba(0, 0, 0, 0.8)
                );
            }

            /* Tombol History dengan warna dasar berbeda tapi hover tetap hijau */
            .btn-history {
                background: linear-gradient(
                    to bottom,
                    rgba(0, 150, 0, 1),
                    rgba(0, 0, 0, 0.7)
                );
            }

            /* --- FOOTER --- */
            .footer {
                padding: 20px;
                background: none;
                color: white;
                text-align: center;
            }

            .h1-footer {
                font-size: 14px;
                font-weight: 300;
                opacity: 0.7;
            }

            /* --- MEDIA QUERIES --- */
            @media screen and (max-width: 768px) {
                .logo {
                    width: 50px;
                    left: 15px;
                    top: 15px;
                }
                .button {
                    min-width: 180px;
                    flex: 1 1 calc(45% - 20px); /* 2 tombol per baris di tablet */
                }
            }

            @media screen and (max-width: 480px) {
                .navbar-content {
                    padding-top: 80px;
                }

                .logo {
                    width: 45px;
                    left: 50%;
                    transform: translateX(-50%);
                    top: 15px;
                }

                .hero h1 {
                    font-size: 1.6rem;
                }

                .button {
                    flex: 1 1 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-utama">
            <nav class="navbar-content">
                <header class="hero">
                    <h1>KickOff Planner</h1>
                    <p>United by the Beautiful Game</p>
                </header>
            </nav>

            <main class="isi-konten">
                <div class="button-menu">
                    <a class="button" href="confirmation_list.html"
                        >CONFIRMATION LIST</a
                    >
                    <a class="button" href="draft.html">TEAM DRAFT</a>
                    <a class="button" href="match_day.html">MATCH DAY</a>
                    <a class="button btn-history" href="history.html"
                        >EVENT HISTORY</a
                    >
                </div>
            </main>

            <footer class="footer">
                <h1 class="h1-footer">KickOff Planner © 2026 by Thoriq.</h1>
            </footer>
        </div>
    </body>
</html>
