<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Draft Tim - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND FULL RESPONSIF --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;

                /* Konfigurasi Background */
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("DC98-transformed.jpeg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR (TEMA NAVY & EMERALD) --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 12px;
                margin-bottom: 20px;
                position: relative;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            .home-box {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
            }

            .home-link {
                font-size: 24px;
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }

            .home-link:hover {
                color: #2ecc71;
            }

            /* Label Navigasi Aktif Emerald */
            .btn-active-nav {
                background-color: #2ecc71;
                padding: 8px 25px;
                border-radius: 8px;
                color: white;
                font-weight: bold;
                box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
                cursor: default;
                user-select: none;
            }

            /* --- KONTEN UTAMA --- */
            .container {
                background: rgba(255, 255, 255, 0.95);
                padding: 25px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 800px;
                text-align: center;
                box-sizing: border-box;
                margin-bottom: 20px;
            }

            h2 {
                color: #2c3e50;
                margin-bottom: 10px;
            }

            #statusInfo {
                margin-bottom: 20px;
                font-weight: bold;
                color: #34495e;
            }

            .btn-group {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-bottom: 25px;
            }

            .btn-action {
                padding: 12px 25px;
                border: none;
                border-radius: 50px;
                font-weight: bold;
                cursor: pointer;
                font-size: 16px;
                transition: 0.3s;
                flex: 1;
                max-width: 200px;
            }

            .btn-shuffle {
                background: #f39c12;
                color: white;
                box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            }

            .btn-shuffle:disabled {
                background: #bdc3c7;
                cursor: not-allowed;
                box-shadow: none;
            }

            .btn-reset {
                background: #bdc3c7;
                color: white;
                cursor: not-allowed;
            }

            .btn-reset.active {
                background: #e74c3c;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
            }

            /* --- TEAM GRID & CARDS --- */
            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                gap: 20px;
                margin-top: 10px;
            }

            .team-card {
                border-radius: 15px;
                padding: 15px;
                color: white;
                min-height: 250px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }

            .merah {
                background: linear-gradient(135deg, #ff5f6d, #ffc371);
            }
            .biru {
                background: linear-gradient(135deg, #2193b0, #6dd5ed);
            }
            .hijau {
                background: linear-gradient(135deg, #11998e, #38ef7d);
            }

            ul.res-list {
                list-style: none;
                padding: 0;
                text-align: left;
            }

            ul.res-list li {
                background: rgba(255, 255, 255, 0.2);
                padding: 10px;
                margin-bottom: 8px;
                border-radius: 8px;
                font-size: 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                backdrop-filter: blur(5px);
            }

            .pos-tag {
                font-size: 10px;
                background: rgba(0, 0, 0, 0.3);
                padding: 2px 8px;
                border-radius: 4px;
                text-transform: uppercase;
                font-weight: bold;
            }

            @media screen and (max-width: 480px) {
                body {
                    padding: 15px 10px;
                    background-attachment: scroll;
                }
                .btn-group {
                    flex-direction: column;
                    align-items: center;
                }
                .btn-action {
                    width: 100%;
                    max-width: none;
                }
                .team-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            <!-- Label navigasi diubah menjadi Draft Tim -->
            <span class="btn-active-nav">DRAFT TIM</span>
        </div>

        <div class="container">
            <!-- Judul konten diubah menjadi Draft Tim Otomatis -->
            <h2><i class="fa-solid fa-shuffle"></i> Draft Tim Otomatis</h2>
            <p id="statusInfo">Menghubungkan ke Database...</p>

            <div class="btn-group">
                <button
                    class="btn-action btn-shuffle"
                    id="btnShuffle"
                    onclick="kocokTim()"
                    disabled
                >
                    <i class="fa-solid fa-random"></i> SHUFFLE
                </button>
                <button
                    class="btn-action btn-reset"
                    id="btnReset"
                    onclick="resetTim()"
                    disabled
                >
                    <i class="fa-solid fa-rotate-right"></i> RESET
                </button>
            </div>

            <div class="team-grid">
                <div class="team-card merah">
                    <h3>Tim Merah</h3>
                    <ul id="resMerah" class="res-list"></ul>
                </div>
                <div class="team-card biru">
                    <h3>Tim Biru</h3>
                    <ul id="resBiru" class="res-list"></ul>
                </div>
                <div class="team-card hijau">
                    <h3>Tim Hijau</h3>
                    <ul id="resHijau" class="res-list"></ul>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const ADMIN_PIN = "admin";
            let dataPemainMain = [];

            async function muatPemain() {
                const statusText = document.getElementById("statusInfo");
                const btnShuffle = document.getElementById("btnShuffle");
                const btnReset = document.getElementById("btnReset");

                try {
                    const { data, error } = await _supabase
                        .from("pemain")
                        .select("*")
                        .neq("posisi", "Penonton");

                    if (error) throw error;
                    dataPemainMain = data;
                    statusText.innerText = `Pemain Siap: ${data.length}`;

                    const sudahDiacak = data.some(
                        (p) => p.tim !== null && p.tim !== "",
                    );

                    if (sudahDiacak) {
                        btnShuffle.disabled = true;
                        btnShuffle.innerText = "DRAFT SELESAI";
                        btnReset.disabled = false;
                        btnReset.classList.add("active");
                    } else {
                        btnShuffle.disabled = data.length < 3;
                        btnShuffle.innerText = "SHUFFLE";
                        btnReset.disabled = true;
                        btnReset.classList.remove("active");
                    }
                    tampilkanKeHalaman(data);
                } catch (err) {
                    console.error(err.message);
                }
            }

            async function kocokTim() {
                const pin = prompt("Input Admin PIN to SHUFFLE:");
                if (pin !== ADMIN_PIN) {
                    alert("Hanya admin yang bisa melakukan draft!");
                    return;
                }

                const btnShuffle = document.getElementById("btnShuffle");
                btnShuffle.innerText = "Processing...";
                btnShuffle.disabled = true;

                let arrayKocok = [...dataPemainMain];
                for (let i = arrayKocok.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arrayKocok[i], arrayKocok[j]] = [
                        arrayKocok[j],
                        arrayKocok[i],
                    ];
                }

                const janjiUpdate = arrayKocok.map((p, index) => {
                    let namaTim =
                        index % 3 === 0
                            ? "Merah"
                            : index % 3 === 1
                              ? "Biru"
                              : "Hijau";
                    return _supabase
                        .from("pemain")
                        .update({ tim: namaTim })
                        .eq("id", p.id);
                });

                await Promise.all(janjiUpdate);
                muatPemain();
            }

            async function resetTim() {
                const yakin = confirm(
                    "Apakah Anda yakin ingin me-reset hasil draft?",
                );
                if (!yakin) return;

                const btnReset = document.getElementById("btnReset");
                btnReset.innerText = "Resetting...";

                const janjiReset = dataPemainMain.map((p) => {
                    return _supabase
                        .from("pemain")
                        .update({ tim: null })
                        .eq("id", p.id);
                });

                await Promise.all(janjiReset);
                muatPemain();
            }

            function tampilkanKeHalaman(list) {
                const res = {
                    Merah: document.getElementById("resMerah"),
                    Biru: document.getElementById("resBiru"),
                    Hijau: document.getElementById("resHijau"),
                };
                Object.values(res).forEach((el) => (el.innerHTML = ""));

                list.forEach((p) => {
                    if (!p.tim) return;
                    const li = `<li><span>${p.nama}</span><span class="pos-tag">${p.posisi}</span></li>`;
                    if (res[p.tim]) res[p.tim].innerHTML += li;
                });
            }

            window.onload = muatPemain;
        </script>
    </body>
</html>
