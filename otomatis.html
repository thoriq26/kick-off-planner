<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Team Draft - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("DC98-transformed.jpeg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 12px;
                margin-bottom: 20px;
                position: relative;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }
            .home-box {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* Tombol Home - Hijau saat Hover/Klik */
            .home-link {
                font-size: 24px;
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover,
            .home-link:active {
                color: #2ecc71;
            }

            .btn-active-nav {
                color: white;
                font-weight: bold;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            /* --- MAIN CONTENT --- */
            .container {
                background: rgba(255, 255, 255, 0.95);
                padding: 25px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 800px;
                text-align: center;
                box-sizing: border-box;
                margin-bottom: 20px;
            }
            h2 {
                color: #2c3e50;
                margin-bottom: 10px;
            }
            #statusInfo {
                margin-bottom: 20px;
                font-weight: bold;
                color: #34495e;
            }

            /* --- BUTTONS --- */
            .btn-group {
                display: flex;
                gap: 15px;
                justify-content: center;
                margin-bottom: 25px;
            }
            .btn-action {
                padding: 12px 25px;
                border: none;
                border-radius: 50px;
                font-weight: bold;
                cursor: pointer;
                font-size: 14px;
                transition: 0.3s;
                flex: 1;
                max-width: 200px;
            }
            .btn-shuffle {
                background: #f39c12;
                color: white;
                box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            }
            .btn-shuffle:disabled {
                background: #bdc3c7;
                cursor: not-allowed;
                box-shadow: none;
            }
            .btn-reset {
                background: #bdc3c7;
                color: white;
                cursor: not-allowed;
            }
            .btn-reset.active {
                background: #e74c3c;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
            }

            /* --- TEAM GRID & CARDS --- */
            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                gap: 20px;
                margin-top: 10px;
            }
            .team-card {
                border-radius: 15px;
                padding: 15px;
                color: white;
                min-height: 150px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            .red {
                background: linear-gradient(135deg, #ff5f6d, #ffc371);
            }
            .blue {
                background: linear-gradient(135deg, #2193b0, #6dd5ed);
            }
            .green {
                background: linear-gradient(135deg, #11998e, #38ef7d);
            }

            ul.res-list {
                list-style: none;
                padding: 0;
                text-align: left;
            }
            ul.res-list li {
                background: rgba(255, 255, 255, 0.2);
                padding: 10px;
                margin-bottom: 8px;
                border-radius: 8px;
                font-size: 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                backdrop-filter: blur(5px);
            }
            .pos-tag {
                font-size: 10px;
                background: rgba(0, 0, 0, 0.3);
                padding: 2px 8px;
                border-radius: 4px;
                text-transform: uppercase;
                font-weight: bold;
                min-width: 35px;
                text-align: center;
            }

            .waiting-message {
                background: rgba(44, 62, 80, 0.05);
                border: 2px dashed #bdc3c7;
                padding: 50px 20px;
                border-radius: 15px;
                color: #7f8c8d;
                grid-column: 1 / -1;
                font-style: italic;
            }

            @media screen and (max-width: 480px) {
                .btn-group {
                    flex-direction: column;
                    align-items: center;
                }
                .btn-action {
                    width: 100%;
                    max-width: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-house"></i
                ></a>
            </div>
            <span class="btn-active-nav">TEAM DRAFT</span>
        </div>

        <div class="container">
            <h2><i class="fa-solid fa-shuffle"></i> Automatic Team Draft</h2>
            <p id="statusInfo">Connecting to Database...</p>

            <div class="btn-group">
                <button
                    class="btn-action btn-shuffle"
                    id="btnShuffle"
                    onclick="shuffleTeams()"
                    disabled
                >
                    <i class="fa-solid fa-random"></i> SHUFFLE
                </button>
                <button
                    class="btn-action btn-reset"
                    id="btnReset"
                    onclick="resetTeams()"
                    disabled
                >
                    <i class="fa-solid fa-rotate-right"></i> RESET
                </button>
            </div>

            <div class="team-grid" id="mainGrid"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const ADMIN_PIN = "admin";
            let mainPlayerData = [];

            // Mapping posisi internasional singkat
            const posMapping = {
                "GOALKEEPER (GK)": "GK",
                "DEFENDER (DF)": "DF",
                "MIDFIELDER (MF)": "MF",
                "WINGER (WG)": "WG",
                "STRIKER (CF)": "CF",
                Penyerang: "CF",
                Gelandang: "MF",
                Bek: "DF",
                Kiper: "GK",
                Winger: "WG",
            };

            async function loadPlayers() {
                const statusText = document.getElementById("statusInfo");
                const btnShuffle = document.getElementById("btnShuffle");
                const btnReset = document.getElementById("btnReset");

                try {
                    const { data, error } = await _supabase
                        .from("pemain")
                        .select("*")
                        .neq("posisi", "SPECTATOR (FAN)")
                        .neq("posisi", "Penonton");

                    if (error) throw error;
                    mainPlayerData = data;
                    statusText.innerText = `Players Ready: ${data.length}`;

                    const alreadyShuffled = data.some(
                        (p) => p.tim !== null && p.tim !== "",
                    );

                    if (alreadyShuffled) {
                        btnShuffle.disabled = true;
                        btnShuffle.innerText = "DRAFT COMPLETED";
                        btnReset.disabled = false;
                        btnReset.classList.add("active");
                    } else {
                        btnShuffle.disabled = data.length < 3;
                        btnShuffle.innerText = "SHUFFLE";
                        btnReset.disabled = true;
                        btnReset.classList.remove("active");
                    }
                    displayToPage(data);
                } catch (err) {
                    console.error(err.message);
                }
            }

            function displayToPage(list) {
                const mainGrid = document.getElementById("mainGrid");
                const alreadyShuffled = list.some(
                    (p) => p.tim !== null && p.tim !== "",
                );

                if (!alreadyShuffled) {
                    mainGrid.innerHTML = `
                        <div class="waiting-message">
                            <i class="fa-solid fa-clock-rotate-left" style="font-size: 40px; margin-bottom: 15px; display: block; color: #bdc3c7;"></i>
                            <b>Draft results not available yet.</b><br>
                            Results will appear automatically after Shuffle.
                        </div>`;
                } else {
                    const hasGreenTeam = list.some(
                        (p) => p.tim === "Green" || p.tim === "Hijau",
                    );

                    let htmlGrid = `
                        <div class="team-card red"><h3>Red Team</h3><ul id="resRed" class="res-list"></ul></div>
                        <div class="team-card blue"><h3>Blue Team</h3><ul id="resBlue" class="res-list"></ul></div>
                    `;
                    if (hasGreenTeam)
                        htmlGrid += `<div class="team-card green"><h3>Green Team</h3><ul id="resGreen" class="res-list"></ul></div>`;

                    mainGrid.innerHTML = htmlGrid;

                    list.forEach((p) => {
                        if (!p.tim) return;

                        let teamId = p.tim;
                        if (teamId === "Merah") teamId = "Red";
                        if (teamId === "Biru") teamId = "Blue";
                        if (teamId === "Hijau") teamId = "Green";

                        const displayPos = posMapping[p.posisi] || p.posisi;

                        const li = `<li><span>${p.nama}</span><span class="pos-tag">${displayPos}</span></li>`;
                        const targetUl = document.getElementById(
                            `res${teamId}`,
                        );
                        if (targetUl) targetUl.innerHTML += li;
                    });
                }
            }

            async function shuffleTeams() {
                const pin = prompt("Enter Admin PIN to SHUFFLE:");
                if (pin !== ADMIN_PIN) {
                    alert("Incorrect PIN!");
                    return;
                }

                const btnShuffle = document.getElementById("btnShuffle");
                btnShuffle.innerText = "Processing...";
                btnShuffle.disabled = true;

                let shuffleArray = [...mainPlayerData];
                for (let i = shuffleArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffleArray[i], shuffleArray[j]] = [
                        shuffleArray[j],
                        shuffleArray[i],
                    ];
                }

                const teamCount = mainPlayerData.length > 10 ? 3 : 2;

                const updatePromises = shuffleArray.map((p, index) => {
                    let teamName;
                    if (teamCount === 3) {
                        teamName =
                            index % 3 === 0
                                ? "Red"
                                : index % 3 === 1
                                  ? "Blue"
                                  : "Green";
                    } else {
                        teamName = index % 2 === 0 ? "Red" : "Blue";
                    }
                    return _supabase
                        .from("pemain")
                        .update({ tim: teamName })
                        .eq("id", p.id);
                });

                await Promise.all(updatePromises);
                loadPlayers();
            }

            async function resetTeams() {
                const pin = prompt("Enter Admin PIN to RESET:");
                if (pin !== ADMIN_PIN) {
                    alert("Incorrect PIN!");
                    return;
                }

                const btnReset = document.getElementById("btnReset");
                btnReset.innerText = "Resetting...";

                const resetPromises = mainPlayerData.map((p) => {
                    return _supabase
                        .from("pemain")
                        .update({ tim: null })
                        .eq("id", p.id);
                });

                await Promise.all(resetPromises);
                loadPlayers();
            }

            window.onload = loadPlayers;
        </script>
    </body>
</html>
