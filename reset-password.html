<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Password - KickOff Planner</title>
        <link rel="icon" type="image/png" href="aaa.png" />
        <link rel="stylesheet" href="auth.css" />
    </head>
    <body>
        <main class="auth-shell">
            <section class="auth-card">
                <div class="brand">KickOff Planner</div>
                <h1>Password Baru</h1>
                <p class="subtitle">Masukkan password baru untuk akun Anda.</p>
                <form id="resetForm">
                    <label for="newPassword">PASSWORD BARU</label>
                    <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required />
                    <label for="confirmNewPassword">KONFIRMASI PASSWORD</label>
                    <input id="confirmNewPassword" type="password" minlength="6" autocomplete="new-password" required />
                    <button class="primary" type="submit">SIMPAN PASSWORD</button>
                </form>
                <p class="form-message" id="resetMessage"></p>
                <div class="auth-footer"><a href="auth.html">Kembali ke login</a></div>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="reset-password-page.js"></script>
    </body>
</html>
