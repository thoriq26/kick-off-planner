<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>KickOff Planner | Home</title>
        <style>
            /* CSS: Untuk mempercantik tampilan */
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f9;
                color: greenyellow;
            }

            /* Bagian Header/Hero */
            .hero {
                /* Gunakan satu deklarasi background-image agar lebih rapi */
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("DC98.jpeg");

                background-size: cover;
                background-position: center;
                height: 60vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                color: white;
            }

            .hero h1 {
                font-size: 3rem;
                margin: 0;
                text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            }

            .hero p {
                font-size: 1.2rem;
                margin-top: 10px;
            }

            /* Tombol Utama */
            .cta-button {
                margin-top: 20px;
                padding: 15px 30px;
                font-size: 1.1rem;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 50px;
                cursor: pointer;
                text-decoration: none;
                transition: 0.3s;
                font-weight: bold;
            }

            .cta-button:hover {
                background-color: #218838;
                transform: scale(1.05);
            }

            /* Bagian Info Singkat */
            .info-section {
                padding: 40px 20px;
                max-width: 800px;
                margin: -50px auto 0 auto;
                background: white;
                border-radius: 15px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            .status-badge {
                display: inline-block;
                background: #e9ecef;
                padding: 5px 15px;
                border-radius: 20px;
                font-size: 0.9rem;
                font-weight: bold;
                color: #495057;
            }

            .grid-info {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-top: 20px;
            }

            .info-card h3 {
                margin-bottom: 5px;
                color: #28a745;
            }
        </style>
    </head>
    <body>
        <!-- BAGIAN 1: HERO SECTION -->
        <header class="hero">
            <h1>KickOff Planner</h1>
            <p>Sepak Bola Menyatukan Kita Semua</p>
            <a href="#daftar" class="cta-button"
                >Ikut Main di Pertandingan Ini</a
            >
        </header>

        <!-- BAGIAN 2: INFO SINGKAT -->
        <section class="info-section">
            <div class="status-badge">Kuota tersisa 5 Orang</div>

            <div class="grid-info">
                <div class="info-card">
                    <h3>Date</h3>
                    <p>Sunday, 16 Mei 2026<br />Time 19.00 WIB</p>
                </div>
                <div class="info-card">
                    <h3>Location</h3>
                    <p>Pakansari Stadion<br />Bogor</p>
                </div>
            </div>
        </section>

        <!-- BAGIAN 3: FOOTER SEDERHANA -->
        <footer
            style="
                text-align: center;
                padding: 40px;
                color: #888;
                font-size: 0.8rem;
            "
        >
            &copy; 2026 KickOff Planner Team. Dibuat dengan ❤️ oleh Farhan.
        </footer>
    </body>
</html>
