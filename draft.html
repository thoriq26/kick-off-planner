<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Team Draft - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                    url("geminix.jpg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 65px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 22px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: red;
            }
            .nav-title {
                color: white;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 1.1rem;
            }

            /* --- TEAM GRID --- */
            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
                width: 100%;
                max-width: 1200px;
            }
            .team-card {
                background: rgba(255, 255, 255, 0.98);
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            }
            .team-header {
                padding: 15px;
                font-weight: 900;
                color: white;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* Team Colors */
            .header-red {
                background: #c0392b;
            }
            .header-blue {
                background: #2980b9;
            }
            .header-green {
                background: #27ae60;
            }
            .header-purple {
                background: #8e44ad;
            }

            .player-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 20px;
                border-bottom: 1px solid #f0f0f0;
                color: #2c3e50;
            }
            .player-item:last-child {
                border-bottom: none;
            }

            .pos-badge {
                background: #34495e;
                color: white;
                padding: 3px 8px;
                border-radius: 5px;
                font-size: 10px;
                font-weight: 800;
            }

            .waiting-box {
                grid-column: 1 / -1;
                text-align: center;
                padding: 80px 20px;
                color: rgba(255, 255, 255, 0.7);
            }
            .waiting-box i {
                font-size: 60px;
                margin-bottom: 20px;
                display: block;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="nav-title">TEAM DRAFT</span>
        </div>

        <div class="team-grid" id="mainGrid"></div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const POS_ORDER = [
                "GK",
                "CB",
                "LB",
                "RB",
                "LWB",
                "RWB",
                "DMF",
                "CMF",
                "AMF",
                "LMF",
                "RMF",
                "LWF",
                "RWF",
                "SS",
                "CF",
            ];
            const TEAM_NAMES = ["Red", "Blue", "Green", "Purple"];

            // --- TEAM DRAFT DISPLAY LOGIC (READ-ONLY) ---
            async function loadData() {
                const { data: players, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .neq("posisi", "SPECTATOR (FAN)");

                if (error) return;

                const grid = document.getElementById("mainGrid");
                const alreadyShuffled = players.some(
                    (p) => p.tim !== null && p.tim !== "",
                );

                if (!alreadyShuffled) {
                    grid.innerHTML = `
                        <div class="waiting-box">
                            <i class="fa-solid fa-users-viewfinder"></i>
                            <p>Draft results not available yet.<br>Results will appear after Shuffle.</p>
                        </div>`;
                } else {
                    renderTeams(players);
                }
            }

            function renderTeams(players) {
                const grid = document.getElementById("mainGrid");
                let html = "";
                const activeTeamNames = TEAM_NAMES.filter((name) =>
                    players.some((p) => p.tim === name),
                );

                activeTeamNames.forEach((color) => {
                    const teamPlayers = players
                        .filter((p) => p.tim === color)
                        .sort(
                            (a, b) =>
                                POS_ORDER.indexOf(a.posisi) -
                                POS_ORDER.indexOf(b.posisi),
                        );

                    if (teamPlayers.length > 0) {
                        html += `
                            <div class="team-card">
                                <div class="team-header header-${color.toLowerCase()}">${color} Team</div>
                                <div class="player-list">
                                    ${teamPlayers
                                        .map(
                                            (p) => `
                                        <div class="player-item">
                                            <span style="font-weight:600">${p.nama}</span>
                                            <span class="pos-badge">${p.posisi}</span>
                                        </div>
                                    `,
                                        )
                                        .join("")}
                                </div>
                            </div>`;
                    }
                });
                grid.innerHTML = html;
            }

            window.onload = loadData;
        </script>
    </body>
</html>
