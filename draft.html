<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Team Draft - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                min-height: 100svh;
                width: 100%;
                box-sizing: border-box;
                padding: clamp(12px, 3vw, 20px);
                overflow-x: hidden;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                    url("geminix.jpg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 12px;
                margin-bottom: 20px;
                min-height: 64px;
                height: auto;
                padding: 12px 64px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 4px;
                position: relative;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 22px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: red;
            }
            .nav-title {
                color: white;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: clamp(0.5px, 0.6vw, 2px);
                font-size: clamp(0.95rem, 4.2vw, 1.1rem);
                text-align: center;
                min-width: 0;
                overflow-wrap: anywhere;
            }

            img,
            svg,
            video {
                max-width: 100%;
            }

            svg {
                flex: 0 0 auto;
            }

            /* --- TEAM GRID --- */
            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
                width: 100%;
                max-width: 1200px;
            }
            .team-card {
                background: rgba(255, 255, 255, 0.98);
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            }
            .team-header {
                padding: 15px;
                font-weight: 900;
                color: white;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* Team Colors */
            .header-red {
                background: #c0392b;
            }
            .header-blue {
                background: #2980b9;
            }
            .header-green {
                background: #27ae60;
            }
            .header-purple {
                background: #8e44ad;
            }

            .player-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                min-width: 0;
                padding: 12px 20px;
                border-bottom: 1px solid #f0f0f0;
                color: #2c3e50;
            }
            .player-item > span:first-child {
                min-width: 0;
                overflow-wrap: anywhere;
            }
            .player-item:last-child {
                border-bottom: none;
            }

            .pos-badge {
                flex: 0 0 auto;
                white-space: nowrap;
                background: #34495e;
                color: white;
                padding: 3px 8px;
                border-radius: 5px;
                font-size: 10px;
                font-weight: 800;
            }

            .waiting-box {
                grid-column: 1 / -1;
                text-align: center;
                padding: 80px 20px;
                color: rgba(255, 255, 255, 0.7);
            }
            .waiting-box i {
                font-size: 60px;
                margin-bottom: 20px;
                display: block;
                opacity: 0.5;
            }
            @media (max-width: 600px) {
                body {
                    padding: 12px;
                    background-attachment: scroll;
                }

                .navbar {
                    padding: 10px 48px;
                    border-radius: 10px;
                }

                .home-link {
                    left: 12px;
                    font-size: 20px;
                }

                .team-grid {
                    gap: 12px;
                }

                .team-header {
                    padding: 12px 10px;
                    font-size: 0.9rem;
                }

                .player-item {
                    padding: 10px 13px;
                }

                .waiting-box {
                    padding: 44px 14px;
                }

                .waiting-box i {
                    font-size: 44px;
                    margin-bottom: 12px;
                }
            }

            @media (max-width: 380px) {
                body {
                    padding: 9px;
                }

                .navbar {
                    padding-left: 42px;
                    padding-right: 42px;
                }

                .team-grid {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="nav-title">PEMBAGIAN TIM</span>
        </div>

        <div class="team-grid" id="mainGrid"></div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="auth-guard.js"></script>
        <script>
            const _supabase = window.KOP.supabase;
            let context;

            const POS_ORDER = [
                "GK",
                "CB",
                "LB",
                "RB",
                "LWB",
                "RWB",
                "DMF",
                "CMF",
                "AMF",
                "LMF",
                "RMF",
                "LWF",
                "RWF",
                "SS",
                "CF",
            ];
            const TEAM_NAMES = ["Red", "Blue", "Green", "Purple"];
            // Database stores English team names; only the label shown to users is localized.
            const TEAM_LABELS = {
                Red: "Merah",
                Blue: "Biru",
                Green: "Hijau",
                Purple: "Ungu",
            };

            // --- TEAM DRAFT DISPLAY LOGIC (READ-ONLY) ---
            async function loadData() {
                const { data: players, error } = await _supabase
                    .from("community_players")
                    .select("*")
                    .eq("community_id", context.community.id)
                    .neq("position", "SPECTATOR (FAN)");

                if (error) return;

                const grid = document.getElementById("mainGrid");
                const alreadyShuffled = players.some(
                    (p) => p.team !== null && p.team !== "",
                );

                if (!alreadyShuffled) {
                    grid.innerHTML = `
                        <div class="waiting-box">
                            <i class="fa-solid fa-users-viewfinder"></i>
                            <p>Hasil pembagian tim belum tersedia.</p>
                        </div>`;
                } else {
                    renderTeams(players);
                }
            }

            function renderTeams(players) {
                const grid = document.getElementById("mainGrid");
                let html = "";
                const activeTeamNames = TEAM_NAMES.filter((name) =>
                    players.some((p) => p.team === name),
                );

                activeTeamNames.forEach((color) => {
                    const teamPlayers = players
                        .filter((p) => p.team === color)
                        .sort(
                            (a, b) =>
                                POS_ORDER.indexOf(a.position) -
                                POS_ORDER.indexOf(b.position),
                        );

                    if (teamPlayers.length > 0) {
                        html += `
                            <div class="team-card">
                                <div class="team-header header-${color.toLowerCase()}">Tim ${TEAM_LABELS[color] || color}</div>
                                <div class="player-list">
                                    ${teamPlayers
                                        .map(
                                            (p) => `
                                        <div class="player-item">
                                            <span style="font-weight:600">${window.KOP.escapeHtml(p.name)}</span>
                                            <span class="pos-badge">${window.KOP.escapeHtml(p.position)}</span>
                                        </div>
                                    `,
                                        )
                                        .join("")}
                                </div>
                            </div>`;
                    }
                });
                grid.innerHTML = html;
            }

            window.onload = async () => {
                context = await window.KOP.auth.getContext({ requireCommunity: true });
                if (context) loadData();
            };
        </script>
    </body>
</html>
