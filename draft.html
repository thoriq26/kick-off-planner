<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Team Draft - KickOff Planner</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <style>
            /* --- RESET & BACKGROUND --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                    url("geminix.jpg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 12px;
                margin-bottom: 20px;
                height: 65px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .home-link {
                position: absolute;
                left: 20px;
                color: white;
                font-size: 22px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: red;
            }
            .nav-title {
                color: white;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 1.1rem;
            }
            .btn-auth {
                position: absolute;
                right: 15px;
                background: transparent;
                border: 2px solid rgba(255, 255, 255, 0.5);
                color: white;
                padding: 6px 15px;
                border-radius: 10px;
                cursor: pointer;
                font-size: 12px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
                text-transform: uppercase;
            }
            .btn-auth.is-admin {
                border-color: #27ae60;
                color: #27ae60;
            }
            .btn-auth:hover {
                background: rgba(255, 255, 255, 0.1);
            }
            .btn-auth.is-admin:hover {
                background: rgba(46, 204, 113, 0.1);
            }

            /* --- ADMIN PANEL --- */
            .admin-panel {
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(10px);
                padding: 15px 25px;
                border-radius: 12px;
                width: 100%;
                max-width: 800px;
                display: none;
                gap: 10px;
                align-items: center;
                justify-content: center;
                margin-bottom: 25px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .label-text {
                color: white;
                font-size: 14px;
                font-weight: 600;
            }
            select {
                padding: 10px;
                border-radius: 8px;
                border: none;
                font-weight: bold;
                cursor: pointer;
            }

            .btn-green {
                background: #27ae60;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
            }
            .btn-green:hover {
                background: #219150;
                transform: translateY(-2px);
            }

            .btn-reset {
                background: #e74c3c;
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
            }
            .btn-reset:hover {
                background: #c0392b;
            }

            /* --- TEAM GRID --- */
            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
                width: 100%;
                max-width: 1200px;
            }
            .team-card {
                background: rgba(255, 255, 255, 0.98);
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            }
            .team-header {
                padding: 15px;
                font-weight: 900;
                color: white;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* Team Colors */
            .header-red {
                background: #c0392b;
            }
            .header-blue {
                background: #2980b9;
            }
            .header-green {
                background: #27ae60;
            }
            .header-purple {
                background: #8e44ad;
            }

            .player-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 20px;
                border-bottom: 1px solid #f0f0f0;
                color: #2c3e50;
            }
            .player-item:last-child {
                border-bottom: none;
            }

            .pos-badge {
                background: #34495e;
                color: white;
                padding: 3px 8px;
                border-radius: 5px;
                font-size: 10px;
                font-weight: 800;
            }

            .waiting-box {
                grid-column: 1 / -1;
                text-align: center;
                padding: 80px 20px;
                color: rgba(255, 255, 255, 0.7);
            }
            .waiting-box i {
                font-size: 60px;
                margin-bottom: 20px;
                display: block;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="home-link">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="nav-title">TEAM DRAFT</span>
            <button id="authBtn" class="btn-auth" onclick="handleAuth()">
                <i id="authIcon" class="fa-solid fa-lock"></i>
                <span id="authText">LOGIN</span>
            </button>
        </div>

        <div id="adminPanel" class="admin-panel">
            <span class="label-text">Divide into:</span>
            <select id="numTeams">
                <option value="2">2 TEAMS</option>
                <option value="3">3 TEAMS</option>
                <option value="4">4 TEAMS</option>
            </select>
            <button class="btn-green" onclick="confirmShuffle()">
                <i class="fa-solid fa-shuffle"></i> SHUFFLE
            </button>
            <button class="btn-reset" onclick="confirmReset()">
                <i class="fa-solid fa-rotate-right"></i> RESET
            </button>
        </div>

        <div class="team-grid" id="mainGrid"></div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            const SUPABASE_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SUPABASE_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let isAdminLoggedIn = false;
            const ADMIN_PIN = "admin";
            const POS_ORDER = [
                "GK",
                "CB",
                "LB",
                "RB",
                "LWB",
                "RWB",
                "DMF",
                "CMF",
                "AMF",
                "LMF",
                "RMF",
                "LWF",
                "RWF",
                "SS",
                "CF",
            ];
            const TEAM_NAMES = ["Red", "Blue", "Green", "Purple"];

            // --- AUTH LOGIC (LOGIN / LOGOUT) ---
            function handleAuth() {
                if (!isAdminLoggedIn) {
                    const pin = prompt("Admin Password:");
                    if (pin === ADMIN_PIN) {
                        isAdminLoggedIn = true;
                        setAdminUI(true);
                        alert("Login Successful! You are now in Admin mode");
                    } else if (pin !== null) {
                        alert("Access Denied! Incorrect Password.");
                    }
                } else {
                    if (confirm("Sign out from Admin mode?")) {
                        isAdminLoggedIn = false;
                        setAdminUI(false);
                    }
                }
            }

            function setAdminUI(loggedIn) {
                const adminPanel = document.getElementById("adminPanel");
                const authBtn = document.getElementById("authBtn");
                const authIcon = document.getElementById("authIcon");
                const authText = document.getElementById("authText");

                if (loggedIn) {
                    adminPanel.style.display = "flex";
                    authBtn.classList.add("is-admin");
                    authIcon.className = "fa-solid fa-unlock-keyhole";
                    authText.innerText = "ADMIN";
                } else {
                    adminPanel.style.display = "none";
                    authBtn.classList.remove("is-admin");
                    authIcon.className = "fa-solid fa-lock";
                    authText.innerText = "LOGIN";
                }
            }

            // --- TEAM DRAFT LOGIC ---
            function confirmShuffle() {
                if (confirm("Shuffle players into teams?")) shuffleTeams();
            }

            function confirmReset() {
                if (confirm("Reset draft? All players will be unassigned."))
                    resetTeams();
            }

            async function loadData() {
                const { data: players, error } = await _supabase
                    .from("pemain")
                    .select("*")
                    .neq("posisi", "SPECTATOR (FAN)");

                if (error) return;

                const grid = document.getElementById("mainGrid");
                const alreadyShuffled = players.some(
                    (p) => p.tim !== null && p.tim !== "",
                );

                if (!alreadyShuffled) {
                    grid.innerHTML = `
                        <div class="waiting-box">
                            <i class="fa-solid fa-users-viewfinder"></i>
                            <p>Draft results not available yet.<br>Results will appear after Shuffle.</p>
                        </div>`;
                } else {
                    renderTeams(players);
                }
            }

            function renderTeams(players) {
                const grid = document.getElementById("mainGrid");
                let html = "";
                const activeTeamNames = TEAM_NAMES.filter((name) =>
                    players.some((p) => p.tim === name),
                );

                activeTeamNames.forEach((color) => {
                    const teamPlayers = players
                        .filter((p) => p.tim === color)
                        .sort(
                            (a, b) =>
                                POS_ORDER.indexOf(a.posisi) -
                                POS_ORDER.indexOf(b.posisi),
                        );

                    if (teamPlayers.length > 0) {
                        html += `
                            <div class="team-card">
                                <div class="team-header header-${color.toLowerCase()}">${color} Team</div>
                                <div class="player-list">
                                    ${teamPlayers
                                        .map(
                                            (p) => `
                                        <div class="player-item">
                                            <span style="font-weight:600">${p.nama}</span>
                                            <span class="pos-badge">${p.posisi}</span>
                                        </div>
                                    `,
                                        )
                                        .join("")}
                                </div>
                            </div>`;
                    }
                });
                grid.innerHTML = html;
            }

            async function shuffleTeams() {
                const numTeams = parseInt(
                    document.getElementById("numTeams").value,
                );
                const { data: players } = await _supabase
                    .from("pemain")
                    .select("*")
                    .neq("posisi", "SPECTATOR (FAN)");

                if (!players || players.length === 0) {
                    alert("No players found to shuffle.");
                    return;
                }

                const grouped = {};
                players.forEach((p) => {
                    if (!grouped[p.posisi]) grouped[p.posisi] = [];
                    grouped[p.posisi].push(p);
                });

                let currentIdx = 0;
                let updates = [];

                POS_ORDER.forEach((pos) => {
                    if (grouped[pos]) {
                        const shuffledPos = grouped[pos].sort(
                            () => Math.random() - 0.5,
                        );
                        shuffledPos.forEach((p) => {
                            updates.push(
                                _supabase
                                    .from("pemain")
                                    .update({ tim: TEAM_NAMES[currentIdx] })
                                    .eq("id", p.id),
                            );
                            currentIdx = (currentIdx + 1) % numTeams;
                        });
                    }
                });

                await Promise.all(updates);
                loadData();
            }

            async function resetTeams() {
                const { data: players } = await _supabase
                    .from("pemain")
                    .select("id");
                const resets = players.map((p) =>
                    _supabase
                        .from("pemain")
                        .update({ tim: null })
                        .eq("id", p.id),
                );
                await Promise.all(resets);
                loadData();
            }

            window.onload = loadData;
        </script>
    </body>
</html>
