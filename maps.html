<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Info Lapangan - DC98</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <!-- Library Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            /* --- RESET & BACKGROUND FULL RESPONSIF --- */
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;

                /* Konfigurasi Background */
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("DC98-transformed.jpeg");
                background-size: cover !important;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* NAVBAR */
            .navbar {
                background: rgba(
                    44,
                    62,
                    80,
                    0.95
                ); /* Sedikit lebih gelap agar emerald kontras */
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 15px;
                margin-bottom: 20px;
                position: relative;
                height: 65px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                flex-shrink: 0;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .home-box {
                position: absolute;
                left: 20px;
                top: 50%;
                transform: translateY(-50%);
            }

            .home-link {
                font-size: 24px;
                color: white;
                text-decoration: none;
                transition: 0.3s;
            }

            .home-link:hover {
                color: #2ecc71; /* Emerald saat hover */
            }

            /* Label Pajangan Emerald */
            .nav-label {
                background-color: #2ecc71; /* Warna Emerald */
                padding: 10px 25px;
                border-radius: 12px;
                color: white;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1px;
                cursor: default;
                user-select: none;
                box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
            }

            /* CONTAINER KONTEN */
            .container {
                background: rgba(255, 255, 255, 0.98);
                padding: 25px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 800px;
                margin-bottom: 20px;
                box-sizing: border-box;
            }

            h2 {
                color: #2c3e50;
                border-left: 6px solid #2ecc71; /* Garis samping Emerald */
                padding-left: 15px;
                margin-top: 0;
            }

            /* DISPLAY AREA */
            .map-frame {
                width: 100%;
                height: 380px;
                border-radius: 15px;
                border: 2px solid #ecf0f1;
                margin-top: 15px;
                background: #f9f9f9;
                overflow: hidden;
            }

            .detail-jadwal {
                background: #f1f8f4; /* Background soft green */
                padding: 18px;
                border-radius: 12px;
                margin-top: 15px;
                border: 1px solid #d1eadd;
            }

            .detail-jadwal span {
                display: block;
                margin-bottom: 8px;
                font-size: 16px;
                color: #2c3e50;
            }

            .badge {
                background: #27ae60;
                color: white;
                padding: 4px 12px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 600;
            }

            /* ADMIN PANEL */
            #adminSection {
                display: none;
                border: 2px dashed #2ecc71;
                background: #f0fff4;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            input,
            .btn {
                padding: 14px;
                border-radius: 10px;
                border: 1px solid #ddd;
                font-size: 15px;
            }

            .btn {
                background: #2ecc71;
                color: white;
                border: none;
                font-weight: bold;
                cursor: pointer;
                transition: 0.2s;
            }

            .btn:hover {
                background: #27ae60;
            }

            /* FLOATING ACTION BUTTON */
            .login-admin-trigger {
                position: fixed;
                bottom: 25px;
                right: 25px;
                background: #2c3e50;
                color: white;
                width: 55px;
                height: 55px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                border: none;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
                z-index: 1000;
                cursor: pointer;
                transition: 0.3s;
            }

            .login-admin-trigger:hover {
                transform: scale(1.1);
                background: #2ecc71;
            }

            @media screen and (max-width: 480px) {
                body {
                    padding: 10px;
                }
                .nav-label {
                    font-size: 13px;
                    padding: 8px 18px;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            <div class="nav-label">Match Day</div>
        </div>

        <div id="adminSection" class="container">
            <h3 style="color: #27ae60">🛠 Panel Admin</h3>
            <div class="form-group">
                <input
                    type="text"
                    id="linkMaps"
                    placeholder="Tempel Link Iframe Google Maps"
                />
                <input type="datetime-local" id="jadwalMain" />
                <input
                    type="text"
                    id="namaLapangan"
                    placeholder="Nama Lapangan"
                />
                <button class="btn" onclick="updateInfo()">
                    Simpan Perubahan
                </button>
                <button
                    class="btn"
                    style="background: #95a5a6"
                    onclick="toggleAdmin()"
                >
                    Batal
                </button>
            </div>
        </div>

        <div class="container">
            <h2 id="displayNama">Memuat Nama Lapangan...</h2>
            <div class="detail-jadwal">
                <span
                    ><strong>📅 Tanggal:</strong>
                    <span id="displayTgl">-</span></span
                >
                <span
                    ><strong>⏰ Waktu:</strong>
                    <span id="displayJam">-</span></span
                >
                <span
                    ><strong>📍 Status:</strong>
                    <span class="badge"
                        ><i class="fa-solid fa-circle-check"></i>
                        Terkonfirmasi</span
                    ></span
                >
            </div>
            <div id="mapContainer" class="map-frame">
                <p style="text-align: center; line-height: 380px; color: #999">
                    Sedang memuat peta...
                </p>
            </div>
        </div>

        <button class="login-admin-trigger" onclick="loginAdmin()">
            <i class="fa-solid fa-user-shield"></i>
        </button>

        <script>
            // Inisialisasi Supabase
            const SB_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SB_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SB_URL, SB_KEY);

            function loginAdmin() {
                const pass = prompt("Masukkan Password Admin:");
                if (pass === "admin") {
                    document.getElementById("adminSection").style.display =
                        "block";
                    window.scrollTo({ top: 0, behavior: "smooth" });
                } else if (pass !== null) {
                    alert("Password Salah!");
                }
            }

            function toggleAdmin() {
                document.getElementById("adminSection").style.display = "none";
            }

            async function updateInfo() {
                const link = document.getElementById("linkMaps").value;
                const jadwal = document.getElementById("jadwalMain").value;
                const nama = document.getElementById("namaLapangan").value;

                if (!nama || !jadwal) {
                    alert("Mohon isi Nama Lapangan dan Jadwal!");
                    return;
                }

                let finalURL = link;
                if (link.includes("<iframe")) {
                    const match = link.match(/src="([^"]+)"/);
                    if (match) finalURL = match[1];
                }

                const { error } = await _supabase
                    .from("jadwal_lapangan")
                    .upsert({
                        id: 1,
                        nama_lp: nama,
                        waktu: jadwal,
                        maps_url: finalURL,
                    });

                if (!error) {
                    alert("Data berhasil diperbarui!");
                    loadInfo();
                    toggleAdmin();
                } else {
                    alert("Gagal memperbarui data.");
                }
            }

            async function loadInfo() {
                const { data, error } = await _supabase
                    .from("jadwal_lapangan")
                    .select("*")
                    .eq("id", 1)
                    .single();

                if (data) {
                    document.getElementById("displayNama").innerText =
                        data.nama_lp;
                    const d = new Date(data.waktu);
                    document.getElementById("displayTgl").innerText =
                        d.toLocaleDateString("id-ID", {
                            weekday: "long",
                            day: "numeric",
                            month: "long",
                            year: "numeric",
                        });
                    document.getElementById("displayJam").innerText =
                        d.toLocaleTimeString("id-ID", {
                            hour: "2-digit",
                            minute: "2-digit",
                        }) + " WIB";

                    if (data.maps_url) {
                        document.getElementById("mapContainer").innerHTML =
                            `<iframe src="${data.maps_url}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
                    }
                }
            }

            window.onload = loadInfo;
        </script>
    </body>
</html>
