<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Info - KickOff Planner</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("gemini.jpg");
                background-size: cover !important;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 20px;
                margin-bottom: 25px;
                position: relative;
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 0 20px;
            }
            .home-box {
                position: absolute;
                left: 20px;
                display: flex;
                align-items: center;
            }
            .home-link {
                color: white;
                font-size: 24px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: #e74c3c;
            }
            .nav-label {
                color: white;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 1.3rem;
            }
            .login-box {
                position: absolute;
                right: 20px;
            }

            .btn-auth {
                background: transparent;
                color: white;
                border: 2px solid rgba(255, 255, 255, 0.5);
                padding: 6px 15px;
                border-radius: 12px;
                font-size: 0.9rem;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.3s;
                text-transform: uppercase;
            }
            .btn-auth.is-admin {
                color: #2ecc71;
                border-color: #2ecc71;
            }

            /* --- CONTENT --- */
            .container {
                background: rgba(255, 255, 255, 0.98);
                padding: 25px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 800px;
                box-sizing: border-box;
                margin-bottom: 20px;
            }

            #adminSection {
                display: none;
                border: 2px dashed #2ecc71;
                background: #f0fff4;
                margin-bottom: 20px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            input,
            .btn {
                padding: 12px;
                border-radius: 10px;
                border: 1px solid #ddd;
                font-size: 15px;
            }

            .btn {
                color: white;
                border: none;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                text-decoration: none;
            }
            .btn-save {
                background: #2ecc71;
                width: 100%;
            }
            .btn-archive {
                background: #e67e22;
                flex: 1;
            }
            .btn-reset {
                background: #94a3b8;
                flex: 1;
            }

            /* --- DETAIL INFO --- */
            .detail-jadwal {
                background: #f8fafc;
                padding: 20px;
                border-radius: 15px;
                border: 1px solid #e2e8f0;
            }
            .info-row {
                display: flex;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px dashed #e2e8f0;
            }
            .info-row:last-child {
                border-bottom: none;
            }
            .info-icon {
                width: 35px;
                font-size: 18px;
                color: #27ae60;
                text-align: center;
                margin-right: 15px;
            }
            .info-content {
                display: flex;
                flex-direction: column;
            }
            .info-label {
                font-size: 11px;
                text-transform: uppercase;
                font-weight: 800;
                color: #94a3b8;
                letter-spacing: 1px;
            }
            .info-value {
                font-size: 15px;
                color: #1e293b;
                font-weight: 600;
            }

            .badge {
                background: #27ae60;
                color: white;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 800;
                text-transform: uppercase;
            }
            .badge.PENDING {
                background: #e74c3c;
            }

            .stadium-name {
                text-align: center;
                color: #1e293b;
                font-size: 22px;
                font-weight: 800;
                margin: 20px 0 10px 0;
                text-transform: uppercase;
            }
            .map-frame {
                width: 100%;
                height: 280px;
                border-radius: 15px;
                border: 2px solid #f1f5f9;
                background: #f9f9f9;
                overflow: hidden;
                position: relative;
            }

            /* --- LOADING STYLES --- */
            @keyframes pulse-soft {
                0% {
                    opacity: 0.5;
                }
                50% {
                    opacity: 1;
                }
                100% {
                    opacity: 0.5;
                }
            }
            .loading-text {
                animation: pulse-soft 1.5s infinite ease-in-out;
                color: #94a3b8 !important;
            }

            .skeleton-loader {
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    #f0f0f0 25%,
                    #e6e6e6 50%,
                    #f0f0f0 75%
                );
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            @keyframes shimmer {
                0% {
                    background-position: 200% 0;
                }
                100% {
                    background-position: -200% 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
            </div>
            <div class="nav-label">Match Day</div>
            <div class="login-box">
                <button id="authBtn" class="btn-auth" onclick="handleAuth()">
                    <i id="authIcon" class="fa-solid fa-lock"></i>
                    <span id="authText">LOGIN</span>
                </button>
            </div>
        </div>

        <div id="adminSection" class="container">
            <h3 style="color: #27ae60; margin-top: 0">🛠 Admin Control</h3>
            <div class="form-group">
                <input
                    type="text"
                    id="eventInput"
                    placeholder="Event Name (e.g. Weekly Fun Football)"
                />
                <input
                    type="text"
                    id="namaLapangan"
                    placeholder="Stadium Name"
                />
                <input
                    type="text"
                    id="jadwalMain"
                    placeholder="Select Date & Time"
                    readonly
                />
                <input
                    type="text"
                    id="jerseyInfo"
                    placeholder="Jersey Color (e.g. Open Bold / All Colors)"
                />
                <input
                    type="text"
                    id="htmInfo"
                    placeholder="Admission Fee (Numbers only)"
                />
                <input
                    type="text"
                    id="rekeningInfo"
                    placeholder="Payment Gateway (Bank / E-Wallet)"
                />
                <input
                    type="text"
                    id="linkMaps"
                    placeholder="Google Maps Link or Iframe"
                />

                <button class="btn btn-save" onclick="updateInfo()">
                    <i class="fa-solid fa-circle-check"></i> PUBLISH MATCH
                </button>

                <div style="display: flex; gap: 10px">
                    <button class="btn btn-archive" onclick="archiveMatch()">
                        <i class="fa-solid fa-box-archive"></i> ARCHIVE
                    </button>
                    <button class="btn btn-reset" onclick="resetMatchOnly()">
                        <i class="fa-solid fa-rotate-left"></i> RESET
                    </button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="detail-jadwal">
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Event Name</span>
                        <span id="displayEvent" class="info-value loading-text"
                            >Scanning events...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Date & Time</span>
                        <span
                            id="displayDateTime"
                            class="info-value loading-text"
                            >Checking schedule...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-shirt"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Jersey Color</span>
                        <span id="displayJersey" class="info-value loading-text"
                            >Waiting info...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Admission Fee</span>
                        <span class="info-value"
                            >IDR
                            <span id="displayHtm" class="loading-text"
                                >0</span
                            ></span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Payment Gateway</span>
                        <span
                            id="displayRekening"
                            class="info-value loading-text"
                            >Waiting info...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i
                            id="statusIcon"
                            class="fa-solid fa-circle-notch fa-spin"
                        ></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Match Status</span>
                        <div>
                            <span id="statusBadge" class="badge"
                                >Checking...</span
                            >
                        </div>
                    </div>
                </div>
            </div>

            <div class="stadium-name loading-text" id="displayNama">
                LOCATING STADIUM...
            </div>

            <div id="mapContainer" class="map-frame">
                <div class="skeleton-loader">
                    <i
                        class="fa-solid fa-futbol fa-spin"
                        style="
                            font-size: 40px;
                            color: #ccc;
                            --fa-animation-duration: 2s;
                        "
                    ></i>
                    <p
                        style="
                            margin-top: 15px;
                            color: #888;
                            font-weight: 600;
                            font-size: 14px;
                            letter-spacing: 1px;
                        "
                    >
                        PREPARING THE PITCH...
                    </p>
                </div>
            </div>
        </div>

        <script>
            const SB_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SB_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SB_URL, SB_KEY);

            let isAdminLoggedIn = false;

            flatpickr("#jadwalMain", {
                enableTime: true,
                dateFormat: "Y-m-d | H:i",
                time_24hr: true,
            });

            function handleAuth() {
                if (!isAdminLoggedIn) {
                    const pass = prompt("Enter Admin Password:");
                    if (pass === "admin") {
                        setAdminUI(true);
                        alert("Welcome Back, Admin!");
                    } else if (pass !== null) {
                        alert("Invalid Credentials!");
                    }
                } else {
                    if (confirm("Sign out from Admin Panel?"))
                        setAdminUI(false);
                }
            }

            function setAdminUI(loggedIn) {
                isAdminLoggedIn = loggedIn;
                const adminSection = document.getElementById("adminSection");
                const authBtn = document.getElementById("authBtn");
                const authText = document.getElementById("authText");
                const authIcon = document.getElementById("authIcon");

                if (loggedIn) {
                    authText.innerText = "ADMIN";
                    authIcon.className = "fa-solid fa-unlock-keyhole";
                    authBtn.classList.add("is-admin");
                    adminSection.style.display = "block";
                } else {
                    authText.innerText = "LOGIN";
                    authIcon.className = "fa-solid fa-lock";
                    authBtn.classList.remove("is-admin");
                    adminSection.style.display = "none";
                }
            }

            async function updateInfo() {
                const event = document.getElementById("eventInput").value;
                const nama = document.getElementById("namaLapangan").value;
                const jadwal = document.getElementById("jadwalMain").value;
                const jersey = document.getElementById("jerseyInfo").value;
                const htm = document.getElementById("htmInfo").value;
                const rekening = document.getElementById("rekeningInfo").value;
                let maps = document.getElementById("linkMaps").value;

                if (maps.includes("<iframe")) {
                    const match = maps.match(/src="([^"]+)"/);
                    if (match) maps = match[1];
                }

                const { error } = await _supabase
                    .from("jadwal_lapangan")
                    .upsert({
                        id: 1,
                        event_name: event,
                        nama_lp: nama,
                        waktu: jadwal,
                        jersey: jersey,
                        htm: htm,
                        rekening: rekening,
                        maps_url: maps,
                    });

                if (!error) {
                    alert("Match details published successfully!");
                    location.reload();
                }
            }

            async function resetMatchOnly() {
                if (!confirm("Reset all match details? This cannot be undone."))
                    return;
                const { error } = await _supabase
                    .from("jadwal_lapangan")
                    .update({
                        event_name: "TBA",
                        nama_lp: "TBA",
                        waktu: null,
                        jersey: "-",
                        htm: "0",
                        rekening: "-",
                        maps_url: "",
                    })
                    .eq("id", 1);
                if (!error) {
                    alert("Match details cleared.");
                    location.reload();
                }
            }

            async function archiveMatch() {
                if (
                    !confirm(
                        "Move current match to history and clear player list?",
                    )
                )
                    return;
                try {
                    const { data: match } = await _supabase
                        .from("jadwal_lapangan")
                        .select("*")
                        .eq("id", 1)
                        .single();
                    const { data: p } = await _supabase
                        .from("pemain")
                        .select("nama");
                    let names =
                        p?.length > 0 ? p.map((x) => x.nama).join(", ") : "-";

                    await _supabase.from("event_history").insert({
                        event_name: match.event_name,
                        location_name: match.nama_lp,
                        match_date: match.waktu,
                        player_list: names,
                        player_count: p?.length || 0,
                    });

                    await _supabase
                        .from("jadwal_lapangan")
                        .update({
                            event_name: "TBA",
                            nama_lp: "TBA",
                            waktu: null,
                            jersey: "-",
                            htm: "0",
                            rekening: "-",
                            maps_url: "",
                        })
                        .eq("id", 1);

                    await _supabase.from("pemain").delete().neq("id", 0);
                    alert("Match archived successfully!");
                    location.reload();
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }

            async function loadInfo() {
                const { data } = await _supabase
                    .from("jadwal_lapangan")
                    .select("*")
                    .eq("id", 1)
                    .single();

                if (data) {
                    // Remove loading states
                    const loaders = document.querySelectorAll(".loading-text");
                    loaders.forEach((el) =>
                        el.classList.remove("loading-text"),
                    );

                    document.getElementById("displayEvent").innerText =
                        data.event_name || "No Event Scheduled";
                    document.getElementById("displayNama").innerText =
                        data.nama_lp || "Stadium TBA";
                    document.getElementById("displayJersey").innerText =
                        data.jersey || "Not Set";
                    document.getElementById("displayHtm").innerText =
                        data.htm || "0";
                    document.getElementById("displayRekening").innerText =
                        data.rekening || "Not Set";

                    // Form inputs
                    document.getElementById("eventInput").value =
                        data.event_name || "";
                    document.getElementById("namaLapangan").value =
                        data.nama_lp || "";
                    document.getElementById("jadwalMain").value = data.waktu
                        ? data.waktu.replace("T", " | ")
                        : "";
                    document.getElementById("jerseyInfo").value =
                        data.jersey || "";
                    document.getElementById("htmInfo").value = data.htm || "";
                    document.getElementById("rekeningInfo").value =
                        data.rekening || "";
                    document.getElementById("linkMaps").value =
                        data.maps_url || "";

                    const badge = document.getElementById("statusBadge");
                    const icon = document.getElementById("statusIcon");

                    if (!data.event_name || data.event_name === "TBA") {
                        badge.innerText = "WAITING";
                        badge.classList.add("PENDING");
                        icon.className = "fa-solid fa-clock";
                        icon.style.color = "#e74c3c";
                    } else {
                        badge.innerText = "CONFIRMED";
                        badge.classList.remove("PENDING");
                        icon.className = "fa-solid fa-circle-check";
                        icon.style.color = "#27ae60";
                    }

                    if (data.waktu) {
                        document.getElementById("displayDateTime").innerText =
                            data.waktu.replace("T", " | ") + " WIB";
                    } else {
                        document.getElementById("displayDateTime").innerText =
                            "Schedule TBA";
                    }

                    // Map Logic
                    const mapContainer =
                        document.getElementById("mapContainer");
                    if (data.maps_url) {
                        if (
                            data.maps_url.includes("google.com/maps/embed") ||
                            data.maps_url.includes("googleusercontent")
                        ) {
                            mapContainer.innerHTML = `<iframe src="${data.maps_url}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
                        } else {
                            mapContainer.innerHTML = `
                                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); overflow: hidden;">
                                    <div style="z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 15px;">
                                        <div style="width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
                                            <i class="fa-solid fa-map-pin" style="font-size: 28px; color: #e74c3c;"></i>
                                        </div>
                                        <div style="text-align: center;">
                                            <p style="margin: 0; font-weight: 800; color: #1e293b; font-size: 16px; letter-spacing: 0.5px;">LOCATION READY</p>
                                            <p style="margin: 4px 0 0 0; font-size: 12px; color: #64748b; font-weight: 500;">Tap button below to navigate</p>
                                        </div>
                                        <a href="${data.maps_url}" target="_blank" class="btn" style="background: #1e293b; width: 200px; padding: 12px; border-radius: 12px; font-size: 13px; color: white;">
                                            <i class="fa-solid fa-location-arrow" style="margin-right: 8px;"></i> GET DIRECTIONS
                                        </a>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
            }
            window.onload = loadInfo;
        </script>
    </body>
</html>
