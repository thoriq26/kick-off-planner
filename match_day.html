<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/svg+xml" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Match Info - KickOff Planner</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                box-sizing: border-box;
                padding: 20px;
                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url("geminix.jpg");
                background-size: cover !important;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-color: #1a1a1a;
            }

            /* --- NAVBAR --- */
            .navbar {
                background: rgba(44, 62, 80, 0.95);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 20px;
                margin-bottom: 25px;
                position: relative;
                height: 70px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 0 20px;
            }
            .home-box {
                position: absolute;
                left: 20px;
                display: flex;
                align-items: center;
            }
            .home-link {
                color: white;
                font-size: 24px;
                text-decoration: none;
                transition: 0.3s;
            }
            .home-link:hover {
                color: #e74c3c;
            }
            .nav-label {
                color: white;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 1.3rem;
            }

            /* --- CONTENT --- */
            .container {
                background: rgba(255, 255, 255, 0.98);
                padding: 25px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 800px;
                box-sizing: border-box;
                margin-bottom: 20px;
            }

            /* --- DETAIL INFO --- */
            .detail-jadwal {
                background: #f8fafc;
                padding: 20px;
                border-radius: 15px;
                border: 1px solid #e2e8f0;
            }
            .info-row {
                display: flex;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px dashed #e2e8f0;
            }
            .info-row:last-child {
                border-bottom: none;
            }
            .info-icon {
                width: 35px;
                font-size: 18px;
                color: #27ae60;
                text-align: center;
                margin-right: 15px;
            }
            .info-content {
                display: flex;
                flex-direction: column;
            }
            .info-label {
                font-size: 11px;
                text-transform: uppercase;
                font-weight: 800;
                color: #94a3b8;
                letter-spacing: 1px;
            }
            .info-value {
                font-size: 15px;
                color: #1e293b;
                font-weight: 600;
            }

            .badge {
                background: #27ae60;
                color: white;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 800;
                text-transform: uppercase;
            }
            .badge.PENDING {
                background: #e74c3c;
            }

            .stadium-name {
                text-align: center;
                color: #1e293b;
                font-size: 22px;
                font-weight: 800;
                margin: 20px 0 10px 0;
                text-transform: uppercase;
            }
            .map-frame {
                width: 100%;
                aspect-ratio: 16 / 9;
                min-height: 260px;
                border-radius: 15px;
                border: 2px solid #f1f5f9;
                background: #f9f9f9;
                overflow: hidden;
                position: relative;
            }
            .map-frame iframe {
                width: 100%;
                height: 100%;
                display: block;
            }

            @media (max-width: 600px) {
                .map-frame {
                    aspect-ratio: 4 / 5;
                    min-height: 320px;
                }
            }

            .btn {
                padding: 12px;
                border-radius: 10px;
                border: none;
                font-size: 15px;
                color: white;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                text-decoration: none;
            }

            /* --- LOADING STYLES --- */
            @keyframes pulse-soft {
                0% {
                    opacity: 0.5;
                }
                50% {
                    opacity: 1;
                }
                100% {
                    opacity: 0.5;
                }
            }
            .loading-text {
                animation: pulse-soft 1.5s infinite ease-in-out;
                color: #94a3b8 !important;
            }

            .skeleton-loader {
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    #f0f0f0 25%,
                    #e6e6e6 50%,
                    #f0f0f0 75%
                );
                background-size: 200% 100%;
                animation: shimmer 1.5s infinite;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            @keyframes shimmer {
                0% {
                    background-position: 200% 0;
                }
                100% {
                    background-position: -200% 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
            </div>
            <div class="nav-label">Match Day</div>
        </div>

        <div class="container">
            <div class="detail-jadwal">
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Event Name</span>
                        <span id="displayEvent" class="info-value loading-text"
                            >Scanning events...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-calendar-day"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Date & Time</span>
                        <span
                            id="displayDateTime"
                            class="info-value loading-text"
                            >Checking schedule...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-shirt"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Jersey Color</span>
                        <span id="displayJersey" class="info-value loading-text"
                            >Waiting info...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Admission Fee</span>
                        <span class="info-value"
                            >IDR
                            <span id="displayHtm" class="loading-text"
                                >0</span
                            ></span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Payment Gateway</span>
                        <span
                            id="displayRekening"
                            class="info-value loading-text"
                            >Waiting info...</span
                        >
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">
                        <i
                            id="statusIcon"
                            class="fa-solid fa-circle-notch fa-spin"
                        ></i>
                    </div>
                    <div class="info-content">
                        <span class="info-label">Match Status</span>
                        <div>
                            <span id="statusBadge" class="badge"
                                >Checking...</span
                            >
                        </div>
                    </div>
                </div>
            </div>

            <div class="stadium-name loading-text" id="displayNama">
                LOCATING STADIUM...
            </div>

            <div id="mapContainer" class="map-frame">
                <div class="skeleton-loader">
                    <i
                        class="fa-solid fa-futbol fa-spin"
                        style="
                            font-size: 40px;
                            color: #ccc;
                            --fa-animation-duration: 2s;
                        "
                    ></i>
                    <p
                        style="
                            margin-top: 15px;
                            color: #888;
                            font-weight: 600;
                            font-size: 14px;
                            letter-spacing: 1px;
                        "
                    >
                        PREPARING THE PITCH...
                    </p>
                </div>
            </div>
        </div>

        <script>
            const SB_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SB_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SB_URL, SB_KEY);

            async function loadInfo() {
                const { data } = await _supabase
                    .from("jadwal_lapangan")
                    .select("*")
                    .eq("id", 1)
                    .single();

                if (data) {
                    // Remove loading states
                    const loaders = document.querySelectorAll(".loading-text");
                    loaders.forEach((el) =>
                        el.classList.remove("loading-text"),
                    );

                    document.getElementById("displayEvent").innerText =
                        data.event_name || "No Event Scheduled";
                    document.getElementById("displayNama").innerText =
                        data.nama_lp || "Stadium TBA";
                    document.getElementById("displayJersey").innerText =
                        data.jersey || "Not Set";
                    document.getElementById("displayHtm").innerText =
                        data.htm || "0";
                    document.getElementById("displayRekening").innerText =
                        data.rekening || "Not Set";

                    const badge = document.getElementById("statusBadge");
                    const icon = document.getElementById("statusIcon");

                    if (!data.event_name || data.event_name === "TBA") {
                        badge.innerText = "WAITING";
                        badge.classList.add("PENDING");
                        icon.className = "fa-solid fa-clock";
                        icon.style.color = "#e74c3c";
                    } else {
                        badge.innerText = "CONFIRMED";
                        badge.classList.remove("PENDING");
                        icon.className = "fa-solid fa-circle-check";
                        icon.style.color = "#27ae60";
                    }

                    if (data.waktu) {
                        document.getElementById("displayDateTime").innerText =
                            data.waktu.replace("T", " | ") + " WIB";
                    } else {
                        document.getElementById("displayDateTime").innerText =
                            "Schedule TBA";
                    }

                    // Map Logic
                    const mapContainer =
                        document.getElementById("mapContainer");
                    if (data.maps_url) {
                        if (
                            data.maps_url.includes("google.com/maps/embed") ||
                            data.maps_url.includes("googleusercontent")
                        ) {
                            mapContainer.innerHTML = `<iframe src="${data.maps_url}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
                        } else {
                            mapContainer.innerHTML = `
                                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); overflow: hidden;">
                                    <div style="z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 15px;">
                                        <div style="width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
                                            <i class="fa-solid fa-map-pin" style="font-size: 28px; color: #e74c3c;"></i>
                                        </div>
                                        <div style="text-align: center;">
                                            <p style="margin: 0; font-weight: 800; color: #1e293b; font-size: 16px; letter-spacing: 0.5px;">LOCATION READY</p>
                                            <p style="margin: 4px 0 0 0; font-size: 12px; color: #64748b; font-weight: 500;">Tap button below to navigate</p>
                                        </div>
                                        <a href="${data.maps_url}" target="_blank" class="btn" style="background: #1e293b; width: 200px; padding: 12px; border-radius: 12px; font-size: 13px; color: white;">
                                            <i class="fa-solid fa-location-arrow" style="margin-right: 8px;"></i> GET DIRECTIONS
                                        </a>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
            }
            window.onload = loadInfo;
        </script>
    </body>
</html>
