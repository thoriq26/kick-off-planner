<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Riwayat Event - KickOff Planner</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="auth-guard.js"></script>

        <style>
            :root {
                --primary-color: #2ecc71;
                --dark-blue: #031c26;
                --text-dark: #2c3e50;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 15px;
                background-color: var(--dark-blue);
                background-image:
                    linear-gradient(rgba(3, 28, 38, 0.8), rgba(3, 28, 38, 0.9)),
                    url("geminix.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                color: white;
                min-height: 100vh;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-x: hidden;
            }

            .navbar {
                background: rgba(4, 41, 58, 0.9);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 15px;
                margin-bottom: 20px;
                min-height: 60px;
                height: auto;
                padding: 10px 56px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 4px;
                position: relative;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .home-box {
                position: absolute;
                left: 20px;
            }
            .home-link {
                color: white;
                font-size: 20px;
                text-decoration: none;
            }

            .home-link:hover {
                color: red;
            }

            .nav-label {
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: clamp(0.5px, 0.6vw, 1.5px);
                font-size: clamp(0.95rem, 4.2vw, 1rem);
                text-align: center;
                min-width: 0;
                overflow-wrap: anywhere;
            }

            img,
            svg,
            video {
                max-width: 100%;
            }

            svg {
                flex: 0 0 auto;
            }

            .container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .history-card {
                background: rgba(255, 255, 255, 0.98);
                color: #1a1a1a;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }

            .empty-state {
                background: rgba(255, 255, 255, 0.98);
                color: #64748b;
                text-align: center;
                padding: 40px 16px;
                border-radius: 12px;
                font-size: 0.92rem;
            }
            .no-result {
                color: #94a3b8;
                font-size: 0.82rem;
                font-style: italic;
                padding: 8px 0;
            }
            .score-line {
                font-weight: 900;
                color: #16693a;
            }
            .fixture-block {
                margin: 12px 0;
                padding: 12px;
                border: 1px solid #d7e9dd;
                border-radius: 12px;
                background: rgba(238, 249, 241, 0.75);
            }
            .fixture-block-title {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.76rem;
                font-weight: 900;
                letter-spacing: 0.04em;
                color: #205c37;
                margin-bottom: 8px;
            }
            .fixture-line {
                padding: 9px 0;
                border-top: 1px solid #d7e9dd;
            }
            .fixture-line:first-of-type {
                border-top: none;
            }
            .fixture-line-label {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 999px;
                background: #dcfce7;
                color: #166534;
                font-size: 0.66rem;
                font-weight: 800;
                margin-bottom: 6px;
            }
            .fixture-line-score {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                font-size: 0.88rem;
                color: #2c3e50;
                margin-bottom: 4px;
            }
            .fixture-line-score b {
                padding: 3px 12px;
                border-radius: 6px;
                background: #16693a;
                color: white;
                font-size: 0.95rem;
                letter-spacing: 0.04em;
            }
            .stat-block {
                list-style: none;
                margin: 8px 0;
                display: grid;
                gap: 5px;
            }
            .stat-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 12px;
                border-radius: 8px;
                background: rgba(238, 249, 241, 0.9);
                border: 1px solid #d7e9dd;
                font-size: 0.8rem;
                color: #205c37;
                flex-wrap: wrap;
            }
            .stat-item i {
                flex: 0 0 auto;
                color: #16693a;
            }
            .stat-player {
                font-weight: 800;
                overflow-wrap: anywhere;
            }
            .stat-team {
                font-size: 0.72rem;
                color: #4b7c5f;
            }
            .stat-value {
                margin-left: auto;
                font-weight: 800;
                white-space: nowrap;
            }
            .stat-card {
                background: rgba(254, 249, 195, 0.55);
                border-color: #fde68a;
                color: #92400e;
            }
            .stat-card i,
            .stat-card .stat-value {
                color: #b45309;
            }
            .filter-row {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin: 8px 0 10px;
            }
            .filter-chip {
                border: 1px solid #cbd5e1;
                border-radius: 999px;
                background: #f8fafc;
                color: #475569;
                font: inherit;
                font-size: 0.72rem;
                font-weight: 800;
                padding: 6px 12px;
                cursor: pointer;
                transition: 0.2s;
            }
            .filter-chip:hover {
                border-color: #94a3b8;
            }
            .filter-chip.active {
                background: #27ae60;
                border-color: #27ae60;
                color: white;
            }
            .team-chip-red.active {
                background: #c0392b;
                border-color: #c0392b;
            }
            .team-chip-blue.active {
                background: #2980b9;
                border-color: #2980b9;
            }
            .team-chip-green.active {
                background: #27ae60;
                border-color: #27ae60;
            }
            .team-chip-purple.active {
                background: #8e44ad;
                border-color: #8e44ad;
            }
            .td-team {
                font-size: 0.74rem;
                font-weight: 800;
                white-space: nowrap;
            }
            .team-red { color: #c0392b; }
            .team-blue { color: #2980b9; }
            .team-green { color: #27ae60; }
            .team-purple { color: #8e44ad; }
            .team-tanpa_tim { color: #64748b; }

            summary {
                padding: 15px 40px 15px 58px;
                cursor: pointer;
                list-style: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                min-width: 0;
                overflow-wrap: anywhere;
                font-weight: 800;
                text-transform: uppercase;
                color: var(--dark-blue);
                font-size: 1rem;
                border-left: 45px solid var(--primary-color);
                position: relative;
            }
            .history-event-name {
                min-width: 0;
                overflow-wrap: anywhere;
            }
            summary::-webkit-details-marker {
                display: none;
            }

            summary::before {
                content: attr(data-number);
                position: absolute;
                left: 0;
                width: 45px;
                text-align: center;
                color: white;
                font-size: 1rem;
                font-weight: 900;
            }

            summary::after {
                content: "\f078";
                margin-left: auto;
                flex: 0 0 auto;
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
                font-size: 0.8rem;
                color: #94a3b8;
                transition: 0.3s;
            }

            details[open] summary::after {
                transform: rotate(180deg);
            }

            .detail-content {
                padding: 15px;
                border-top: 1px solid #e2e8f0;
                background: white;
            }

            .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
                gap: 10px;
                margin-bottom: 15px;
            }

            .match-info {
                min-width: 0;
                font-size: 0.85rem;
                display: flex;
                align-items: flex-start;
                gap: 10px;
                color: #475569;
                overflow-wrap: anywhere;
            }

            .match-info i {
                color: var(--primary-color);
                width: 16px;
                text-align: center;
            }

            /* --- STYLING SQUAD SECTION & MINI PAGINATION --- */
            .squad-section {
                background: #ffffff;
                border-radius: 8px;
                border: 1px solid #e2e8f0;
                overflow: hidden;
                margin-top: 10px;
            }

            .squad-label {
                background: #f8fafc;
                padding: 10px 15px;
                font-weight: 800;
                font-size: 0.75rem;
                color: #64748b;
                display: block;
                border-bottom: 1px solid #e2e8f0;
            }

            .squad-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.9rem;
                table-layout: fixed;
            }

            .squad-table tr {
                border-bottom: 1px solid #f1f5f9;
            }

            .squad-table td {
                padding: 10px 15px;
                overflow-wrap: anywhere;
            }

            .td-number {
                width: 40px;
                font-weight: bold;
                color: #94a3b8;
                border-right: 1px solid #f1f5f9;
                text-align: center;
            }

            .td-name {
                font-weight: 600;
                text-transform: capitalize;
            }

            .squad-table td.td-team {
                width: 110px;
                text-align: right;
            }

            /* Info Text & Mini Pagination Buttons */
            .mini-pagination-container {
                padding: 10px 15px;
                background: #f8fafc;
                border-top: 1px solid #e2e8f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .mini-info-text {
                font-size: 0.75rem;
                color: #64748b;
                font-weight: 500;
            }

            .mini-btns {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }

            .mini-btn {
                background: white;
                border: 1px solid #cbd5e1;
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 0.75rem;
                cursor: pointer;
                color: var(--text-dark);
                transition: 0.2s;
            }

            .mini-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                color: white;
                font-weight: bold;
            }

            .pagination {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin: 25px 0;
            }

            .page-btn {
                background: rgba(255, 255, 255, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
            }

            .page-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                font-weight: bold;
            }

            @media (max-width: 700px) {
                body {
                    padding: 12px;
                    background-attachment: scroll;
                }

                .navbar {
                    padding: 10px 48px;
                    border-radius: 12px;
                }

                .home-box {
                    left: 12px;
                }

                .container {
                    gap: 10px;
                }

                .detail-content {
                    padding: 12px;
                }

                .squad-table td {
                    padding: 9px 11px;
                }
            }

            @media (max-width: 480px) {
                .navbar {
                    padding-left: 42px;
                    padding-right: 42px;
                }

                summary {
                    padding: 12px 30px 12px 46px;
                    font-size: 0.86rem;
                    border-left-width: 38px;
                }

                summary::before {
                    width: 38px;
                    font-size: 0.9rem;
                }

                .info-grid {
                    grid-template-columns: 1fr;
                }

                .mini-btn {
                    padding: 7px 11px;
                }
            }

            @media (pointer: coarse) {
                .mini-btn {
                    padding: 9px 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
            </div>
            <div class="nav-label">Riwayat Event</div>
        </div>

        <div class="container" id="historyList"></div>
        <div class="pagination" id="paginationControls"></div>

        <script>
            const _supabase = window.KOP.supabase;
            let context;

            let currentPage = 1;
            const itemsPerPage = 10;
            let totalData = [];

            function formatDateTime(dateString) {
                if (!dateString || dateString === "N/A") return "N/A";
                return dateString.replace("T", " | ").substring(0, 21);
            }

            const TEAM_LABELS = {
                Red: "Merah",
                Blue: "Biru",
                Green: "Hijau",
                Purple: "Ungu",
                "Tanpa Tim": "Tanpa Tim",
            };
            const TEAM_ORDER = ["Red", "Blue", "Green", "Purple", "Tanpa Tim"];

            function normalizeTeamName(team) {
                const match = TEAM_ORDER.find(
                    (key) => key.toLowerCase() === String(team || "").trim().toLowerCase(),
                );
                return match || "Tanpa Tim";
            }

            function teamLabel(team) {
                return TEAM_LABELS[team] || team;
            }

            // The archived row already stores the team split, so the list stays
            // correct even after the player rows were deleted.
            function getTeamGroups(item) {
                const split = item.team_players;
                if (split && typeof split === "object" && !Array.isArray(split)) {
                    const groups = TEAM_ORDER.filter(
                        (team) => Array.isArray(split[team]) && split[team].length,
                    ).map((team) => ({ team, players: split[team] }));
                    if (groups.length) return groups;
                }
                const players =
                    item.player_list && item.player_list !== "-"
                        ? item.player_list
                              .split(",")
                              .map((p) => p.trim())
                              .filter((p) => p !== "")
                        : [];
                return players.length ? [{ team: "Tanpa Tim", players }] : [];
            }

            function getFixtures(item) {
                return Array.isArray(item.fixtures) ? item.fixtures : [];
            }

            function fixtureHasScore(fixture) {
                return (
                    Number(fixture.score_home) > 0 || Number(fixture.score_away) > 0
                );
            }

            // Each matchup is shown on its own so a 3-team round robin reads as
            // three separate results rather than one ambiguous score.
            function renderFixtures(item) {
                const fixtures = getFixtures(item);
                if (!fixtures.length) return "";
                const rows = fixtures
                    .map((fixture) => {
                        const home = normalizeTeamName(fixture.home);
                        const away = normalizeTeamName(fixture.away);
                        const score = fixtureHasScore(fixture)
                            ? `${fixture.score_home} - ${fixture.score_away}`
                            : "-";
                        const detail = [
                            renderStatEntries(fixture.goals, "goal"),
                            renderStatEntries(fixture.assists, "assist"),
                            renderStatEntries(fixture.cards, "card"),
                        ].join("");
                        return `<div class="fixture-line">
                            <span class="fixture-line-label">Round ${fixture.round || "-"}</span>
                            <span class="fixture-line-score">
                                ${window.KOP.escapeHtml(teamLabel(home))}
                                <b>${window.KOP.escapeHtml(score)}</b>
                                ${window.KOP.escapeHtml(teamLabel(away))}
                            </span>
                            ${detail}
                        </div>`;
                    })
                    .join("");
                return `<div class="fixture-block"><div class="fixture-block-title">
                        <i class="fa-solid fa-trophy"></i> Hasil per Pertandingan
                    </div>${rows}</div>`;
            }

            function renderStatEntries(entries, kind) {
                if (!Array.isArray(entries) || !entries.length) return "";
                const icon =
                    kind === "goal"
                        ? "fa-futbol"
                        : kind === "assist"
                        ? "fa-hand-pointer"
                        : "fa-rectangle";
                const rows = entries
                    .map((entry) => {
                        const team = normalizeTeamName(entry.team);
                        const label =
                            kind === "card"
                                ? entry.type === "red"
                                    ? "Kartu Merah"
                                    : "Kartu Kuning"
                                : `${entry.minute || 0}'`;
                        return `<li class="stat-item stat-${kind}"><i class="fa-solid ${icon}"></i>
                            <span class="stat-player">${window.KOP.escapeHtml(entry.player || "")}</span>
                            <span class="stat-team">Tim ${window.KOP.escapeHtml(teamLabel(team))}</span>
                            <span class="stat-value">${window.KOP.escapeHtml(label)}</span>
                        </li>`;
                    })
                    .join("");
                return `<ul class="stat-block">${rows}</ul>`;
            }

            // --- LOGIKA MINI PAGINATION SQUAD ---
            function renderSquadTable(eventId, groups, filter = "all", page = 1) {
                const limit = 5;
                const visible =
                    filter === "all"
                        ? groups
                        : groups.filter((group) => group.team === filter);
                const flat = visible.flatMap((group) =>
                    group.players.map((player) => ({
                        player,
                        team: group.team,
                    })),
                );
                const total = flat.length;
                const totalPages = Math.max(1, Math.ceil(total / limit));
                const safePage = Math.min(Math.max(1, page), totalPages);
                const start = (safePage - 1) * limit;
                const end = Math.min(start + limit, total);
                const rows = flat.slice(start, end);

                let html = "";
                if (!total) {
                    html = '<p class="no-result">Tidak ada pemain pada filter ini.</p>';
                } else {
                    html = `<table class="squad-table"><tbody>`;
                    rows.forEach((row, i) => {
                        html += `<tr>
                            <td class="td-number">${start + i + 1}</td>
                            <td class="td-name">${window.KOP.escapeHtml(row.player)}</td>
                            <td class="td-team team-${row.team.toLowerCase()}">Tim ${window.KOP.escapeHtml(teamLabel(row.team))}</td>
                        </tr>`;
                    });
                    html += `</tbody></table>`;

                    if (totalPages > 1) {
                        html += `
                        <div class="mini-pagination-container">
                            <div class="mini-info-text">Menampilkan ${start + 1}–${end}</div>
                            <div class="mini-btns">`;
                        for (let j = 1; j <= totalPages; j++) {
                            html += `<button class="mini-btn ${
                                j === safePage ? "active" : ""
                            }" onclick="changeSquadPage('${eventId}', '${filter}', ${j})">${j}</button>`;
                        }
                        html += `</div></div>`;
                    }
                }

                const target = document.getElementById(`squad-container-${eventId}`);
                if (target) target.innerHTML = html;
            }

            function renderTeamFilter(eventId, groups) {
                const target = document.getElementById(`filter-container-${eventId}`);
                if (!target) return;
                const options = [`<button class="filter-chip active" data-filter="all">Semua (${groups.reduce(
                    (sum, group) => sum + group.players.length,
                    0,
                )})</button>`];
                groups.forEach((group) => {
                    options.push(
                        `<button class="filter-chip team-chip-${group.team.toLowerCase()}" data-filter="${group.team}">Tim ${window.KOP.escapeHtml(
                            teamLabel(group.team),
                        )} (${group.players.length})</button>`,
                    );
                });
                target.innerHTML = options.join("");
                target.querySelectorAll(".filter-chip").forEach((chip) => {
                    chip.addEventListener("click", () => {
                        target
                            .querySelectorAll(".filter-chip")
                            .forEach((other) => other.classList.remove("active"));
                        chip.classList.add("active");
                        const item = totalData.find((d) => d.id == eventId);
                        if (item) {
                            renderSquadTable(
                                eventId,
                                getTeamGroups(item),
                                chip.dataset.filter,
                                1,
                            );
                        }
                    });
                });
            }

            // Fungsi global untuk ganti halaman squad (dipanggil via onclick)
            window.changeSquadPage = (eventId, filter, page) => {
                const item = totalData.find((d) => d.id == eventId);
                if (!item) return;
                renderSquadTable(eventId, getTeamGroups(item), filter, page);
            };

            async function loadData() {
                const { data, error } = await _supabase
                    .from("community_event_history")
                    .select("*")
                    .eq("community_id", context.community.id)
                    .order("created_at", { ascending: false });
                if (error) return;
                totalData = data || [];
                if (!totalData.length) {
                    const container = document.getElementById("historyList");
                    container.innerHTML =
                        '<div class="empty-state">Belum ada riwayat event.</div>';
                    document.getElementById("paginationControls").innerHTML = "";
                    return;
                }
                renderPage(1);
            }

            function renderPage(page) {
                currentPage = page;
                const container = document.getElementById("historyList");
                container.innerHTML = "";
                const startIndex = (page - 1) * itemsPerPage;
                const pageData = totalData.slice(
                    startIndex,
                    startIndex + itemsPerPage,
                );

                pageData.forEach((item, index) => {
                    const matchNumber = totalData.length - (startIndex + index);
                    const groups = getTeamGroups(item);
                    const totalPlayers = groups.reduce(
                        (sum, group) => sum + group.players.length,
                        0,
                    );

                    const card = document.createElement("details");
                    card.className = "history-card";
                    card.innerHTML = `
                        <summary data-number="${matchNumber}"><span class="history-event-name">${window.KOP.escapeHtml(item.event_name)}</span></summary>
                        <div class="detail-content">
                            <div class="info-grid">
                                <div class="match-info"><i class="fa-solid fa-location-dot"></i> ${window.KOP.escapeHtml(item.location_name)}</div>
                                <div class="match-info"><i class="fa-solid fa-calendar"></i> ${window.KOP.escapeHtml(formatDateTime(item.match_date))}</div>
                                <div class="match-info"><i class="fa-solid fa-users"></i> ${totalPlayers} Peserta</div>
                            </div>
                            ${renderFixtures(item)}
                            <div class="squad-section">
                                <span class="squad-label">DAFTAR HADIR</span>
                                <div class="filter-row" id="filter-container-${item.id}"></div>
                                <div id="squad-container-${item.id}"></div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    renderTeamFilter(item.id, groups);
                    renderSquadTable(item.id, groups, "all", 1);
                });
                renderPagination();
            }

            function renderPagination() {
                const controls = document.getElementById("paginationControls");
                controls.innerHTML = "";
                const totalPages = Math.ceil(totalData.length / itemsPerPage);
                if (totalPages <= 1) return;
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement("button");
                    btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
                    btn.innerText = i;
                    btn.onclick = () => {
                        renderPage(i);
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    };
                    controls.appendChild(btn);
                }
            }

            window.onload = async () => {
                context = await window.KOP.auth.getContext({ requireCommunity: true });
                if (context) loadData();
            };
        </script>
    </body>
</html>
