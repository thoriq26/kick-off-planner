<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Event History - KickOff Planner</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            :root {
                --primary-color: #2ecc71;
                --dark-blue: #031c26;
                --text-dark: #2c3e50;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 15px;
                background-color: var(--dark-blue);
                background-image:
                    linear-gradient(rgba(3, 28, 38, 0.8), rgba(3, 28, 38, 0.9)),
                    url("gemini.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                color: white;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .navbar {
                background: rgba(4, 41, 58, 0.9);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 15px;
                margin-bottom: 20px;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .home-box {
                position: absolute;
                left: 20px;
            }
            .home-link {
                color: white;
                font-size: 20px;
                text-decoration: none;
            }

            .home-link:hover {
                color: red;
            }

            .nav-label {
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                font-size: 1rem;
            }

            .container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .history-card {
                background: rgba(255, 255, 255, 0.98);
                color: #1a1a1a;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }

            summary {
                padding: 15px;
                cursor: pointer;
                list-style: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: 800;
                text-transform: uppercase;
                color: var(--dark-blue);
                font-size: 1rem;
                border-left: 45px solid var(--primary-color);
                position: relative;
            }

            summary::before {
                content: attr(data-number);
                position: absolute;
                left: -33px;
                color: white;
                font-size: 1.1rem;
                font-weight: 900;
            }

            summary::after {
                content: "\f078";
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
                font-size: 0.8rem;
                color: #94a3b8;
                transition: 0.3s;
            }

            details[open] summary::after {
                transform: rotate(180deg);
            }

            .detail-content {
                padding: 15px;
                border-top: 1px solid #e2e8f0;
                background: white;
            }

            .info-grid {
                display: grid;
                gap: 10px;
                margin-bottom: 15px;
            }

            .match-info {
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                gap: 10px;
                color: #475569;
            }

            .match-info i {
                color: var(--primary-color);
                width: 16px;
                text-align: center;
            }

            /* --- STYLING SQUAD SECTION & MINI PAGINATION --- */
            .squad-section {
                background: #ffffff;
                border-radius: 8px;
                border: 1px solid #e2e8f0;
                overflow: hidden;
                margin-top: 10px;
            }

            .squad-label {
                background: #f8fafc;
                padding: 10px 15px;
                font-weight: 800;
                font-size: 0.75rem;
                color: #64748b;
                display: block;
                border-bottom: 1px solid #e2e8f0;
            }

            .squad-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.9rem;
            }

            .squad-table tr {
                border-bottom: 1px solid #f1f5f9;
            }

            .squad-table td {
                padding: 10px 15px;
            }

            .td-number {
                width: 40px;
                font-weight: bold;
                color: #94a3b8;
                border-right: 1px solid #f1f5f9;
                text-align: center;
            }

            .td-name {
                font-weight: 600;
                text-transform: capitalize;
            }

            /* Info Text & Mini Pagination Buttons */
            .mini-pagination-container {
                padding: 10px 15px;
                background: #f8fafc;
                border-top: 1px solid #e2e8f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .mini-info-text {
                font-size: 0.75rem;
                color: #64748b;
                font-weight: 500;
            }

            .mini-btns {
                display: flex;
                gap: 5px;
            }

            .mini-btn {
                background: white;
                border: 1px solid #cbd5e1;
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 0.75rem;
                cursor: pointer;
                color: var(--text-dark);
                transition: 0.2s;
            }

            .mini-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                color: white;
                font-weight: bold;
            }

            .delete-btn {
                margin-top: 15px;
                display: flex;
                justify-content: flex-end;
                color: #ef4444;
                cursor: pointer;
                font-size: 1.2rem;
                opacity: 0.7;
            }

            .pagination {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin: 25px 0;
            }

            .page-btn {
                background: rgba(255, 255, 255, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
            }

            .page-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                font-weight: bold;
            }

            @media (max-width: 480px) {
                summary {
                    font-size: 0.9rem;
                    border-left-width: 40px;
                }
                summary::before {
                    left: -30px;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
            </div>
            <div class="nav-label">Event History</div>
        </div>

        <div class="container" id="historyList"></div>
        <div class="pagination" id="paginationControls"></div>

        <script>
            const SB_URL = "https://yyngexaagxboclzvhtlt.supabase.co";
            const SB_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmdleGFhZ3hib2NsenZodGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzI4ODcsImV4cCI6MjA5MzY0ODg4N30.gl1XXutl4va8pty1OO1CIT7jdW62wAWMFO0IyUiWNb4";
            const _supabase = supabase.createClient(SB_URL, SB_KEY);

            let currentPage = 1;
            const itemsPerPage = 10;
            let totalData = [];

            function formatDateTime(dateString) {
                if (!dateString || dateString === "N/A") return "N/A";
                return dateString.replace("T", " | ").substring(0, 21);
            }

            // --- LOGIKA MINI PAGINATION SQUAD ---
            function renderSquadTable(eventId, players, page = 1) {
                const limit = 5;
                const total = players.length;
                const totalPages = Math.ceil(total / limit);
                const start = (page - 1) * limit;
                const end = Math.min(start + limit, total);
                const paginatedPlayers = players.slice(start, end);

                let html = `<table class="squad-table">`;
                paginatedPlayers.forEach((p, i) => {
                    html += `<tr><td class="td-number">${start + i + 1}</td><td class="td-name">${p}</td></tr>`;
                });
                html += `</table>`;

                if (totalPages > 1) {
                    html += `
                    <div class="mini-pagination-container">
                        <div class="mini-info-text">Showing ${start + 1} to ${end} of ${total} entries</div>
                        <div class="mini-btns">`;
                    for (let j = 1; j <= totalPages; j++) {
                        html += `<button class="mini-btn ${j === page ? "active" : ""}" onclick="changeSquadPage('${eventId}', ${j})">${j}</button>`;
                    }
                    html += `</div></div>`;
                }

                const target = document.getElementById(
                    `squad-container-${eventId}`,
                );
                if (target) target.innerHTML = html;
            }

            // Fungsi global untuk ganti halaman squad (dipanggil via onclick)
            window.changeSquadPage = (eventId, page) => {
                const item = totalData.find((d) => d.id == eventId);
                const players = item.player_list
                    .split(",")
                    .map((p) => p.trim())
                    .filter((p) => p !== "");
                renderSquadTable(eventId, players, page);
            };

            async function loadData() {
                const { data, error } = await _supabase
                    .from("event_history")
                    .select("*")
                    .order("created_at", { ascending: false });
                if (error) return;
                totalData = data;
                renderPage(1);
            }

            function renderPage(page) {
                currentPage = page;
                const container = document.getElementById("historyList");
                container.innerHTML = "";
                const startIndex = (page - 1) * itemsPerPage;
                const pageData = totalData.slice(
                    startIndex,
                    startIndex + itemsPerPage,
                );

                pageData.forEach((item, index) => {
                    const matchNumber = totalData.length - (startIndex + index);
                    const players =
                        item.player_list && item.player_list !== "-"
                            ? item.player_list
                                  .split(",")
                                  .map((p) => p.trim())
                                  .filter((p) => p !== "")
                            : [];

                    const card = document.createElement("details");
                    card.className = "history-card";
                    card.innerHTML = `
                        <summary data-number="${matchNumber}">${item.event_name}</summary>
                        <div class="detail-content">
                            <div class="info-grid">
                                <div class="match-info"><i class="fa-solid fa-location-dot"></i> ${item.location_name}</div>
                                <div class="match-info"><i class="fa-solid fa-calendar"></i> ${formatDateTime(item.match_date)}</div>
                                <div class="match-info"><i class="fa-solid fa-users"></i> ${item.player_count} Participants</div>
                            </div>
                            <div class="squad-section">
                                <span class="squad-label">ATTENDANCE LIST</span>
                                <div id="squad-container-${item.id}"></div>
                            </div>
                            <div class="delete-btn" onclick="deleteHistory(${item.id})"><i class="fa-solid fa-trash-can"></i></div>
                        </div>
                    `;
                    container.appendChild(card);
                    renderSquadTable(item.id, players, 1);
                });
                renderPagination();
            }

            function renderPagination() {
                const controls = document.getElementById("paginationControls");
                controls.innerHTML = "";
                const totalPages = Math.ceil(totalData.length / itemsPerPage);
                if (totalPages <= 1) return;
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement("button");
                    btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
                    btn.innerText = i;
                    btn.onclick = () => {
                        renderPage(i);
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    };
                    controls.appendChild(btn);
                }
            }

            async function deleteHistory(id) {
                const password = prompt("Enter Admin Password:");
                if (
                    password === "admin" &&
                    confirm("Delete record permanently?")
                ) {
                    const { error } = await _supabase
                        .from("event_history")
                        .delete()
                        .eq("id", id);
                    if (!error) {
                        alert("Deleted.");
                        loadData();
                    }
                }
            }

            window.onload = loadData;
        </script>
    </body>
</html>
