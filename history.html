<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="aaa.png" />
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Event History - KickOff Planner</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="auth-guard.js"></script>

        <style>
            :root {
                --primary-color: #2ecc71;
                --dark-blue: #031c26;
                --text-dark: #2c3e50;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 15px;
                background-color: var(--dark-blue);
                background-image:
                    linear-gradient(rgba(3, 28, 38, 0.8), rgba(3, 28, 38, 0.9)),
                    url("geminix.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                color: white;
                min-height: 100vh;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-x: hidden;
            }

            .navbar {
                background: rgba(4, 41, 58, 0.9);
                backdrop-filter: blur(10px);
                width: 100%;
                max-width: 800px;
                border-radius: 15px;
                margin-bottom: 20px;
                min-height: 60px;
                height: auto;
                padding: 10px 56px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 4px;
                position: relative;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .home-box {
                position: absolute;
                left: 20px;
            }
            .home-link {
                color: white;
                font-size: 20px;
                text-decoration: none;
            }

            .home-link:hover {
                color: red;
            }

            .nav-label {
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: clamp(0.5px, 0.6vw, 1.5px);
                font-size: clamp(0.95rem, 4.2vw, 1rem);
                text-align: center;
                min-width: 0;
                overflow-wrap: anywhere;
            }

            img,
            svg,
            video {
                max-width: 100%;
            }

            svg {
                flex: 0 0 auto;
            }

            .container {
                width: 100%;
                max-width: 800px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .history-card {
                background: rgba(255, 255, 255, 0.98);
                color: #1a1a1a;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }

            summary {
                padding: 15px 40px 15px 58px;
                cursor: pointer;
                list-style: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                min-width: 0;
                overflow-wrap: anywhere;
                font-weight: 800;
                text-transform: uppercase;
                color: var(--dark-blue);
                font-size: 1rem;
                border-left: 45px solid var(--primary-color);
                position: relative;
            }
            .history-event-name {
                min-width: 0;
                overflow-wrap: anywhere;
            }
            summary::-webkit-details-marker {
                display: none;
            }

            summary::before {
                content: attr(data-number);
                position: absolute;
                left: 0;
                width: 45px;
                text-align: center;
                color: white;
                font-size: 1rem;
                font-weight: 900;
            }

            summary::after {
                content: "\f078";
                margin-left: auto;
                flex: 0 0 auto;
                font-family: "Font Awesome 6 Free";
                font-weight: 900;
                font-size: 0.8rem;
                color: #94a3b8;
                transition: 0.3s;
            }

            details[open] summary::after {
                transform: rotate(180deg);
            }

            .detail-content {
                padding: 15px;
                border-top: 1px solid #e2e8f0;
                background: white;
            }

            .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
                gap: 10px;
                margin-bottom: 15px;
            }

            .match-info {
                min-width: 0;
                font-size: 0.85rem;
                display: flex;
                align-items: flex-start;
                gap: 10px;
                color: #475569;
                overflow-wrap: anywhere;
            }

            .match-info i {
                color: var(--primary-color);
                width: 16px;
                text-align: center;
            }

            /* --- STYLING SQUAD SECTION & MINI PAGINATION --- */
            .squad-section {
                background: #ffffff;
                border-radius: 8px;
                border: 1px solid #e2e8f0;
                overflow: hidden;
                margin-top: 10px;
            }

            .squad-label {
                background: #f8fafc;
                padding: 10px 15px;
                font-weight: 800;
                font-size: 0.75rem;
                color: #64748b;
                display: block;
                border-bottom: 1px solid #e2e8f0;
            }

            .squad-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.9rem;
                table-layout: fixed;
            }

            .squad-table tr {
                border-bottom: 1px solid #f1f5f9;
            }

            .squad-table td {
                padding: 10px 15px;
                overflow-wrap: anywhere;
            }

            .td-number {
                width: 40px;
                font-weight: bold;
                color: #94a3b8;
                border-right: 1px solid #f1f5f9;
                text-align: center;
            }

            .td-name {
                font-weight: 600;
                text-transform: capitalize;
            }

            /* Info Text & Mini Pagination Buttons */
            .mini-pagination-container {
                padding: 10px 15px;
                background: #f8fafc;
                border-top: 1px solid #e2e8f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .mini-info-text {
                font-size: 0.75rem;
                color: #64748b;
                font-weight: 500;
            }

            .mini-btns {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }

            .mini-btn {
                background: white;
                border: 1px solid #cbd5e1;
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 0.75rem;
                cursor: pointer;
                color: var(--text-dark);
                transition: 0.2s;
            }

            .mini-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                color: white;
                font-weight: bold;
            }

            .pagination {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin: 25px 0;
            }

            .page-btn {
                background: rgba(255, 255, 255, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: white;
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
            }

            .page-btn.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                font-weight: bold;
            }

            @media (max-width: 700px) {
                body {
                    padding: 12px;
                    background-attachment: scroll;
                }

                .navbar {
                    padding: 10px 48px;
                    border-radius: 12px;
                }

                .home-box {
                    left: 12px;
                }

                .container {
                    gap: 10px;
                }

                .detail-content {
                    padding: 12px;
                }

                .squad-table td {
                    padding: 9px 11px;
                }
            }

            @media (max-width: 480px) {
                .navbar {
                    padding-left: 42px;
                    padding-right: 42px;
                }

                summary {
                    padding: 12px 30px 12px 46px;
                    font-size: 0.86rem;
                    border-left-width: 38px;
                }

                summary::before {
                    width: 38px;
                    font-size: 0.9rem;
                }

                .info-grid {
                    grid-template-columns: 1fr;
                }

                .mini-btn {
                    padding: 7px 11px;
                }
            }

            @media (pointer: coarse) {
                .mini-btn {
                    padding: 9px 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="home-box">
                <a href="index.html" class="home-link"
                    ><i class="fa-solid fa-arrow-left"></i
                ></a>
            </div>
            <div class="nav-label">Event History</div>
        </div>

        <div class="container" id="historyList"></div>
        <div class="pagination" id="paginationControls"></div>

        <script>
            const _supabase = window.KOP.supabase;
            let context;

            let currentPage = 1;
            const itemsPerPage = 10;
            let totalData = [];

            function formatDateTime(dateString) {
                if (!dateString || dateString === "N/A") return "N/A";
                return dateString.replace("T", " | ").substring(0, 21);
            }

            // --- LOGIKA MINI PAGINATION SQUAD ---
            function renderSquadTable(eventId, players, page = 1) {
                const limit = 5;
                const total = players.length;
                const totalPages = Math.ceil(total / limit);
                const start = (page - 1) * limit;
                const end = Math.min(start + limit, total);
                const paginatedPlayers = players.slice(start, end);

                let html = `<table class="squad-table">`;
                paginatedPlayers.forEach((p, i) => {
                    html += `<tr><td class="td-number">${start + i + 1}</td><td class="td-name">${window.KOP.escapeHtml(p)}</td></tr>`;
                });
                html += `</table>`;

                if (totalPages > 1) {
                    html += `
                    <div class="mini-pagination-container">
                        <div class="mini-info-text">Showing ${start + 1} to ${end} of ${total} entries</div>
                        <div class="mini-btns">`;
                    for (let j = 1; j <= totalPages; j++) {
                        html += `<button class="mini-btn ${j === page ? "active" : ""}" onclick="changeSquadPage('${eventId}', ${j})">${j}</button>`;
                    }
                    html += `</div></div>`;
                }

                const target = document.getElementById(
                    `squad-container-${eventId}`,
                );
                if (target) target.innerHTML = html;
            }

            // Fungsi global untuk ganti halaman squad (dipanggil via onclick)
            window.changeSquadPage = (eventId, page) => {
                const item = totalData.find((d) => d.id == eventId);
                const players = (item?.player_list || "-")
                    .split(",")
                    .map((p) => p.trim())
                    .filter((p) => p !== "");
                renderSquadTable(eventId, players, page);
            };

            async function loadData() {
                const { data, error } = await _supabase
                    .from("community_event_history")
                    .select("*")
                    .eq("community_id", context.community.id)
                    .order("created_at", { ascending: false });
                if (error) return;
                totalData = data;
                renderPage(1);
            }

            function renderPage(page) {
                currentPage = page;
                const container = document.getElementById("historyList");
                container.innerHTML = "";
                const startIndex = (page - 1) * itemsPerPage;
                const pageData = totalData.slice(
                    startIndex,
                    startIndex + itemsPerPage,
                );

                pageData.forEach((item, index) => {
                    const matchNumber = totalData.length - (startIndex + index);
                    const players =
                        item.player_list && item.player_list !== "-"
                            ? item.player_list
                                  .split(",")
                                  .map((p) => p.trim())
                                  .filter((p) => p !== "")
                            : [];

                    const card = document.createElement("details");
                    card.className = "history-card";
                    card.innerHTML = `
                        <summary data-number="${matchNumber}"><span class="history-event-name">${window.KOP.escapeHtml(item.event_name)}</span></summary>
                        <div class="detail-content">
                            <div class="info-grid">
                                <div class="match-info"><i class="fa-solid fa-location-dot"></i> ${window.KOP.escapeHtml(item.location_name)}</div>
                                <div class="match-info"><i class="fa-solid fa-calendar"></i> ${window.KOP.escapeHtml(formatDateTime(item.match_date))}</div>
                                <div class="match-info"><i class="fa-solid fa-users"></i> ${window.KOP.escapeHtml(item.player_count)} Participants</div>
                            </div>
                            <div class="squad-section">
                                <span class="squad-label">ATTENDANCE LIST</span>
                                <div id="squad-container-${item.id}"></div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    renderSquadTable(item.id, players, 1);
                });
                renderPagination();
            }

            function renderPagination() {
                const controls = document.getElementById("paginationControls");
                controls.innerHTML = "";
                const totalPages = Math.ceil(totalData.length / itemsPerPage);
                if (totalPages <= 1) return;
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement("button");
                    btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
                    btn.innerText = i;
                    btn.onclick = () => {
                        renderPage(i);
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    };
                    controls.appendChild(btn);
                }
            }

            window.onload = async () => {
                context = await window.KOP.auth.getContext({ requireCommunity: true });
                if (context) loadData();
            };
        </script>
    </body>
</html>
